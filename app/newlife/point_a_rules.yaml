# Правила перевода ответов онбординга в уровень точки А по сфере (§5
# docs/specs/NEWLIFE_V8_SPEC.md). Один вопрос на сферу, 4 варианта, каждый — число
# уровня 1..10. Человек может поправить уровень вручную кнопками (§12) —
# это только стартовая оценка.
body:
  prompt: "Как бы ты оценил(а) свою физическую форму сейчас?"
  options:
    - label: "Почти не двигаюсь"
      level: 2
    - label: "Иногда гуляю или двигаюсь"
      level: 4
    - label: "Тренируюсь время от времени"
      level: 6
    - label: "Регулярно тренируюсь"
      level: 8
mind:
  prompt: "Как твоё ментальное состояние в последнее время?"
  options:
    - label: "Часто тревожно или тяжело"
      level: 2
    - label: "Бывает по-разному"
      level: 4
    - label: "В целом стабильно"
      level: 6
    - label: "Спокойно и уверенно"
      level: 8
character:
  prompt: "Насколько ты держишь слово перед собой?"
  options:
    - label: "Почти никогда не довожу начатое до конца"
      level: 2
    - label: "Иногда срываюсь"
      level: 4
    - label: "В основном держусь"
      level: 6
    - label: "Почти всегда довожу до конца"
      level: 8
social:
  prompt: "Как у тебя с общением и новыми людьми?"
  options:
    - label: "Почти не общаюсь, кроме необходимого"
      level: 2
    - label: "Общаюсь по минимуму"
      level: 4
    - label: "Есть круг общения, который устраивает"
      level: 6
    - label: "Много живого общения"
      level: 8
career:
  prompt: "Как дела с карьерой и навыками?"
  options:
    - label: "Стою на месте, не развиваюсь"
      level: 2
    - label: "Развиваюсь редко, без системы"
      level: 4
    - label: "Регулярно прокачиваю навыки"
      level: 6
    - label: "Уверенно расту, вижу прогресс"
      level: 8
finance:
  prompt: "Как твоё финансовое состояние?"
  options:
    - label: "Еле свожу концы с концами"
      level: 2
    - label: "Живу от зарплаты до зарплаты"
      level: 4
    - label: "Есть небольшая подушка"
      level: 6
    - label: "Уверенно откладываю и планирую"
      level: 8
relationships:
  prompt: "Как ты оцениваешь близкие отношения?"
  options:
    - label: "Не хватает близости ни с кем"
      level: 2
    - label: "Есть, но хочется лучше"
      level: 4
    - label: "В целом всё устраивает"
      level: 6
    - label: "Близкие, тёплые отношения"
      level: 8
knowledge:
  prompt: "Как часто узнаёшь что-то новое вне работы?"
  options:
    - label: "Почти никогда"
      level: 2
    - label: "Изредка"
      level: 4
    - label: "Регулярно читаю/смотрю/изучаю"
      level: 6
    - label: "Постоянно учусь новому"
      level: 8
values:
  prompt: "Насколько ясно ты понимаешь, что для тебя важно?"
  options:
    - label: "Пока не задумывался(ась)"
      level: 2
    - label: "Есть смутные ориентиры"
      level: 4
    - label: "В целом понимаю свои ценности"
      level: 6
    - label: "Чётко знаю, что важно, и живу по этому"
      level: 8
lifestyle:
  prompt: "Как ты оцениваешь свой образ жизни в целом?"
  options:
    - label: "Хаос, нет никакого порядка"
      level: 2
    - label: "Частично по накатанной"
      level: 4
    - label: "В целом порядок устраивает"
      level: 6
    - label: "Осознанный, продуманный образ жизни"
      level: 8
energy:
  prompt: "Как твоя энергия и стресс в последнее время?"
  options:
    - label: "Постоянно устал(а) и на пределе"
      level: 2
    - label: "Сил часто не хватает"
      level: 4
    - label: "В целом в порядке"
      level: 6
    - label: "Бодро и спокойно"
      level: 8
