# Правила перевода ответов онбординга в уровень точки А по сфере (§5
# docs/specs/NEWLIFE_V8_SPEC.md). Один вопрос на сферу, 4 варианта, каждый — число
# уровня 1..10. Человек может поправить уровень вручную кнопками (§12) —
# это только стартовая оценка.
#
# Все 11 вопросов — из docs/content/NEWLIFE_1_0_CONTENT.md (раздел A каждой
# сферы), приоритет выше NEWLIFE_V8_SPEC.md; тон нормализован под "ты"
# (в документе часть разделов писана на "вы").
body:
  prompt: "Сколько дней в неделю ты двигаешься хотя бы 30 минут?"
  options:
    - label: "Почти никогда"
      level: 2
    - label: "1–2 дня"
      level: 4
    - label: "3–4 дня"
      level: 6
    - label: "5+ дней и тренируюсь"
      level: 9
energy:
  prompt: "Как ты обычно чувствуешь себя к вечеру за последние 2 недели?"
  options:
    - label: "Без сил и в постоянном напряжении"
      level: 2
    - label: "Часто устаю, стресс мешает"
      level: 4
    - label: "По-разному, справляюсь"
      level: 6
    - label: "Бодро, стресс под контролем"
      level: 9
mind:
  prompt: "Сколько минут подряд ты обычно работаешь над одной задачей, не заглядывая в телефон?"
  options:
    - label: "Меньше 10 минут"
      level: 2
    - label: "10–25 минут"
      level: 4
    - label: "25–50 минут"
      level: 6
    - label: "Больше 50 минут"
      level: 8
knowledge:
  prompt: "Как часто ты узнаёшь и повторяешь новое вне учёбы?"
  options:
    - label: "Почти никогда"
      level: 2
    - label: "Иногда смотрю видео, но не повторяю"
      level: 4
    - label: "Регулярно читаю или смотрю, редко повторяю"
      level: 6
    - label: "Регулярно учу и повторяю (карточки, конспекты)"
      level: 8
career:
  prompt: "Что у тебя уже есть для будущей работы?"
  options:
    - label: "Пока ничего конкретного"
      level: 2
    - label: "Учу язык или навык, но без результата"
      level: 4
    - label: "Есть уровень языка или навык и 1–2 своих проекта"
      level: 6
    - label: "Сертификат, портфолио или опыт работы"
      level: 8
character:
  prompt: "Как часто ты делаешь то, что сам себе пообещал?"
  options:
    - label: "Почти никогда"
      level: 2
    - label: "Иногда, если есть настроение"
      level: 4
    - label: "Чаще да, но срываюсь"
      level: 6
    - label: "Почти всегда"
      level: 9
social:
  prompt: "Как ты чувствуешь себя, когда нужно заговорить с незнакомым человеком или выступить?"
  options:
    - label: "Избегаю любой ценой"
      level: 2
    - label: "Делаю, но сильно волнуюсь"
      level: 4
    - label: "Нормально, если подготовлюсь"
      level: 7
    - label: "Легко, даже без подготовки"
      level: 9
values:
  prompt: "Как часто ты останавливаешься подумать о главном в жизни: за что благодарен, что для тебя важно?"
  options:
    - label: "Почти никогда"
      level: 2
    - label: "Раз в месяц или реже"
      level: 4
    - label: "Несколько раз в неделю"
      level: 7
    - label: "Каждый день"
      level: 9
finance:
  prompt: "Знаешь, сколько потратил(а) за прошлый месяц?"
  options:
    - label: "Понятия не имею"
      level: 2
    - label: "Примерно, ±50%"
      level: 4
    - label: "Веду учёт, но без бюджета и запаса"
      level: 7
    - label: "Есть бюджет и запас"
      level: 9
relationships:
  prompt: "Как часто ты проводишь время с близкими без телефона?"
  options:
    - label: "Почти никогда"
      level: 2
    - label: "Раз в пару недель"
      level: 4
    - label: "Каждую неделю"
      level: 7
    - label: "Несколько раз в неделю"
      level: 9
lifestyle:
  prompt: "Сколько у тебя в неделю времени на себя (хобби, отдых без экрана)?"
  options:
    - label: "Почти нет"
      level: 2
    - label: "1–2 часа"
      level: 4
    - label: "3–5 часов"
      level: 7
    - label: "Больше 5 часов, и меня это устраивает"
      level: 9
