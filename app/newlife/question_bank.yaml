# Банк "вопрос дня" (PRD 1.0 F7): первые 7 дней после регистрации — по
# одному вопросу в день на "Сегодня" из активных сфер пользователя. Ответ
# не меняет точку А автоматически (вопросы качественные, без прямого
# отображения в уровень 1-10, в отличие от app/newlife/point_a_rules.yaml) —
# он уточняет картину для самого человека и виден в "Я" → профиль.
# Источник: docs/content/NEWLIFE_1_0_CONTENT.md (раздел E каждой сферы).
body:
  - id: body_water_today
    text: "Сколько стаканов воды ты уже выпил(а) сегодня?"
    options: ["0–2", "3–4", "5–6", "7+"]
  - id: body_sitting_today
    text: "Сколько часов ты сегодня просидел(а) без перерыва?"
    options: ["<1", "1–2", "2–3", "3+"]
  - id: body_protein_today
    text: "Был ли сегодня в рационе белок в каждом приёме пищи?"
    options: ["Да", "В половине", "Нет"]
energy:
  - id: energy_drained_today
    text: "Что сегодня забрало больше всего сил?"
    options: ["Учёба", "Работа", "Люди", "Недосып"]
  - id: energy_daylight_today
    text: "Сколько минут ты сегодня был(а) на улице при дневном свете?"
    options: ["0", "<15", "15–30", "30+"]
  - id: energy_relax_today
    text: "Что лучше всего помогло тебе сегодня расслабиться?"
    options: ["Движение", "Общение", "Тишина", "Ничего"]
mind:
  - id: mind_distraction_today
    text: "Что чаще всего сбивает тебя во время учёбы?"
    options: ["Уведомления", "Мысли", "Шум", "Соцсети", "Усталость"]
  - id: mind_exam_prep
    text: "Как ты обычно готовишься к экзамену?"
    options: ["Перечитываю", "Выделяю маркером", "Решаю тесты", "Объясняю другим"]
  - id: mind_sleep_time
    text: "Во сколько ты обычно засыпаешь?"
    options: ["До 23:00", "23:00–00:00", "00:00–01:00", "После 01:00"]
knowledge:
  - id: knowledge_interest_topic
    text: "Какая тема тебе интереснее всего?"
    options: ["История", "Наука", "Экономика", "География", "Искусство"]
  - id: knowledge_daily_minutes
    text: "Сколько минут в день реально готов(а) уделять изучению нового?"
    options: ["5", "10", "20", "30+"]
  - id: knowledge_tried_cards
    text: "Пробовал(а) карточки для запоминания (Anki, Quizlet)?"
    options: ["Нет", "Бросил(а)", "Иногда", "Регулярно"]
career:
  - id: career_main_language
    text: "Твой главный язык для роста?"
    options: ["Английский", "Русский", "Корейский", "Немецкий", "Другой"]
  - id: career_level_proof
    text: "Как ты подтвердил(а) свой уровень?"
    options: ["Никак", "Онлайн-тест", "Национальный сертификат", "IELTS или CEFR"]
  - id: career_direction
    text: "Какое направление ближе?"
    options: ["Программирование", "Аналитика данных", "Дизайн", "Маркетинг и SMM", "Пока не знаю"]
character:
  - id: character_start_blocker
    text: "Что чаще всего мешает тебе начать?"
    options: ["Телефон", "Усталость", "Страх ошибки", "Непонятно, с чего начать"]
  - id: character_promises_yesterday
    text: "Сколько обещаний себе ты сдержал(а) вчера?"
    options: ["0", "1", "2", "3+"]
  - id: character_energy_peak
    text: "Когда у тебя больше всего энергии?"
    options: ["Утро", "День", "Вечер", "Ночь"]
social:
  - id: social_hardest_situation
    text: "Какая ситуация для тебя самая трудная?"
    options: ["Выступление", "Знакомство", "Просьба", "Отказ", "Конфликт"]
  - id: social_new_people_yesterday
    text: "Со сколькими новыми людьми ты заговорил(а) вчера?"
    options: ["0", "1", "2–3", "4+"]
  - id: social_paraphrased_today
    text: "Ты сегодня перефразировал(а) собеседника, чтобы показать, что понял(а)?"
    options: ["Да", "Нет", "Забыл(а)", "Не было разговоров"]
values:
  - id: values_most_important
    text: "Что для тебя важнее всего прямо сейчас?"
    options: ["Семья", "Развитие", "Здоровье", "Вера", "Свобода"]
  - id: values_grateful_today
    text: "За что ты благодарен(на) сегодня?"
    options: ["Люди", "Здоровье", "Учёба или работа", "Мелочи", "Пока не знаю"]
  - id: values_track_religion
    text: "Хочешь отслеживать религиозную практику?"
    options: ["Да", "Нет", "Позже"]
finance:
  - id: finance_biggest_expense
    text: "Что больше всего съедает деньги?"
    options: ["Еда вне дома", "Транспорт", "Покупки", "Развлечения", "Не знаю"]
  - id: finance_emergency_1m
    text: "Если завтра понадобится 1 млн сум на непредвиденное?"
    options: ["Есть свои", "Займу у близких", "Кредит или рассрочка", "Не знаю"]
  - id: finance_money_feeling
    text: "Как ты себя чувствуешь, думая о деньгах?"
    options: ["Спокойно", "Немного тревожно", "Сильный стресс", "Не думаю об этом"]
relationships:
  - id: relationships_missing_whom
    text: "С кем тебе сейчас не хватает общения?"
    options: ["Семья", "Друзья", "Партнёр", "Новые люди", "Всем хватает"]
  - id: relationships_main_blocker
    text: "Что мешает общению больше всего?"
    options: ["Нет времени", "Телефон", "Стеснение", "Конфликты", "Далеко живём"]
  - id: relationships_conflict_reaction
    text: "Как ты обычно реагируешь в споре?"
    options: ["Спокойно обсуждаю", "Повышаю голос", "Молчу и ухожу", "Уступаю"]
lifestyle:
  - id: lifestyle_social_media_yesterday
    text: "Сколько минут ты вчера провёл(а) в соцсетях?"
    options: ["<30", "30–60", "1–2 ч", ">2 ч", "Не знаю"]
  - id: lifestyle_real_joy
    text: "Что тебя по-настоящему радует?"
    options: ["Творчество", "Спорт", "Природа", "Люди", "Учёба"]
  - id: lifestyle_room_state
    text: "Как выглядит твоя комната сейчас?"
    options: ["Порядок", "Немного хаоса", "Хаос", "Стыдно показать"]
