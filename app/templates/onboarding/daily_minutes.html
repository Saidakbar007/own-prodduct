{% extends "base.html" %}
{% block title %}{{ t('onboarding.daily_minutes_title') }} — {{ t('common.app_name') }}{% endblock %}
{% block content %}
<div class="onboarding-progress"><span class="onboarding-progress__fill" style="width:58%"></span></div>
<div class="home-hero" style="padding-top:var(--space-8)">
  <h1>{{ t('onboarding.daily_minutes_title') }}</h1>
  <p>{{ t('onboarding.daily_minutes_why') }}</p>
</div>
<form method="post" action="/onboarding/daily-minutes">
  <div style="display:flex;flex-direction:column;gap:var(--space-3)">
    {% for opt in options %}
    <label class="card" style="display:flex;align-items:center;gap:var(--space-3);padding:var(--space-5);cursor:pointer">
      <input type="radio" name="daily_minutes" value="{{ opt }}" {% if opt == selected %}checked{% endif %} />
      <span style="font-family:var(--font-display);font-size:var(--text-md)">{{ opt }} {{ t('onboarding.minutes_suffix') }}</span>
    </label>
    {% endfor %}
  </div>
  <button class="btn btn--primary btn--block" type="submit" style="margin-top:var(--space-5)">{{ t('onboarding.continue') }}</button>
</form>
{% endblock %}
