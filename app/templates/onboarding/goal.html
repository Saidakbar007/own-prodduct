{% extends "base.html" %}
{% block title %}{{ t('onboarding.goal_title') }} — {{ t('common.app_name') }}{% endblock %}
{% block content %}
<div class="home-hero" style="padding-top:var(--space-8)">
  <h1>{{ t('onboarding.goal_title') }}</h1>
  <p>{{ t('onboarding.goal_subtitle') }}</p>
</div>

<div style="display:flex;flex-direction:column;gap:var(--space-3)">
  {% for tile in tiles %}
  <form method="post" action="/onboarding/goal">
    <input type="hidden" name="template_id" value="{{ tile.id }}" />
    <button type="submit" class="card" style="width:100%;text-align:left;padding:var(--space-5);cursor:pointer;border:1px solid var(--border)">
      <strong style="font-family:var(--font-display);font-size:var(--text-md)">{{ tile.title }}</strong>
      <div style="margin-top:var(--space-2);font-size:var(--text-xs);color:var(--text-faint);text-transform:uppercase;letter-spacing:var(--tracking-wide)">{{ tile.lengths|join(' / ') }} {{ t('onboarding.days_suffix') }}</div>
    </button>
  </form>
  {% endfor %}

  <form method="post" action="/onboarding/goal" style="margin-top:var(--space-4)">
    <input type="hidden" name="template_id" value="custom" />
    <div class="field">
      <label for="custom_text">{{ t('onboarding.custom_label') }}</label>
      <input id="custom_text" name="custom_text" type="text" placeholder="{{ t('onboarding.custom_placeholder') }}" />
    </div>
    <button type="submit" class="btn btn--secondary btn--block">{{ t('onboarding.custom_submit') }}</button>
  </form>
</div>
{% endblock %}
