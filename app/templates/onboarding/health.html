{% extends "base.html" %}
{% block content %}
<div class="home-hero" style="padding-top:var(--space-8)">
  <h1>{{ t('onboarding.health_title') }}</h1>
  <p>{{ t('onboarding.health_subtitle') }}</p>
</div>

{% if error %}<p class="form-error">{{ t(error) }}</p>{% endif %}

<form method="post" action="/onboarding/health" class="card" style="padding:var(--space-6)">
  <div class="field">
    <label for="height_cm">{{ t('onboarding.height_label') }}</label>
    <input id="height_cm" name="height_cm" type="number" min="100" max="250" required />
  </div>
  <div class="field">
    <label for="weight_kg">{{ t('onboarding.weight_label') }}</label>
    <input id="weight_kg" name="weight_kg" type="number" step="0.1" min="30" max="300" required />
  </div>
  <div class="field">
    <label for="birth_year">{{ t('auth.birth_year_label') }}</label>
    <input id="birth_year" name="birth_year" type="number" min="1900" max="2026" required />
  </div>

  <div class="field">
    <label>{{ t('onboarding.diagnosis_question') }}</label>
    <input type="hidden" id="has_medical_diagnosis" name="has_medical_diagnosis" value="0" />
    <div style="display:flex;gap:var(--space-3)">
      <button type="button" class="btn btn--secondary" style="flex:1" id="diagnosis-no" onclick="document.getElementById('has_medical_diagnosis').value='0';document.getElementById('diagnosis-no').classList.add('btn--primary');document.getElementById('diagnosis-yes').classList.remove('btn--primary')">{{ t('measure.answer_no') }}</button>
      <button type="button" class="btn btn--secondary" style="flex:1" id="diagnosis-yes" onclick="document.getElementById('has_medical_diagnosis').value='1';document.getElementById('diagnosis-yes').classList.add('btn--primary');document.getElementById('diagnosis-no').classList.remove('btn--primary')">{{ t('measure.answer_yes') }}</button>
    </div>
  </div>

  <div class="field">
    <label>{{ t('onboarding.pregnancy_question') }}</label>
    <input type="hidden" id="is_pregnant" name="is_pregnant" value="0" />
    <div style="display:flex;gap:var(--space-3)">
      <button type="button" class="btn btn--secondary" style="flex:1" id="pregnant-no" onclick="document.getElementById('is_pregnant').value='0';document.getElementById('pregnant-no').classList.add('btn--primary');document.getElementById('pregnant-yes').classList.remove('btn--primary')">{{ t('measure.answer_no') }}</button>
      <button type="button" class="btn btn--secondary" style="flex:1" id="pregnant-yes" onclick="document.getElementById('is_pregnant').value='1';document.getElementById('pregnant-yes').classList.add('btn--primary');document.getElementById('pregnant-no').classList.remove('btn--primary')">{{ t('measure.answer_yes') }}</button>
    </div>
  </div>

  <div class="field">
    <label>{{ t('onboarding.eating_signal_question') }}</label>
    <input type="hidden" id="disordered_eating_signal" name="disordered_eating_signal" value="0" />
    <div style="display:flex;gap:var(--space-3)">
      <button type="button" class="btn btn--secondary" style="flex:1" id="eating-no" onclick="document.getElementById('disordered_eating_signal').value='0';document.getElementById('eating-no').classList.add('btn--primary');document.getElementById('eating-yes').classList.remove('btn--primary')">{{ t('measure.answer_no') }}</button>
      <button type="button" class="btn btn--secondary" style="flex:1" id="eating-yes" onclick="document.getElementById('disordered_eating_signal').value='1';document.getElementById('eating-yes').classList.add('btn--primary');document.getElementById('eating-no').classList.remove('btn--primary')">{{ t('measure.answer_yes') }}</button>
    </div>
  </div>

  <button class="btn btn--primary btn--block" type="submit">{{ t('onboarding.continue') }}</button>
</form>
{% endblock %}
