<!doctype html>
<html lang="{{ lang }}" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="manifest" href="/static/manifest.json" />
<meta name="theme-color" content="#15120f" />
<title>{% block title %}{{ t('common.app_name') }}{% endblock %}</title>
<link rel="stylesheet" href="/design/tokens.css" />
<link rel="stylesheet" href="/design/base.css" />
<link rel="stylesheet" href="/design/components.css" />
<link rel="stylesheet" href="/static/app.css" />
</head>
<body style="min-height:100dvh;display:flex;flex-direction:column">
<svg class="sr-only" aria-hidden="true">
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-half" viewBox="0 0 24 24"><path d="M5 12.5l3 3L12 11" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-life" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" stroke-width="1.75"/><circle cx="12" cy="12" r="3" stroke-width="1.75"/><path d="M6.3 6.3l3.1 3.1M17.7 6.3l-3.1 3.1M6.3 17.7l3.1-3.1M17.7 17.7l-3.1-3.1" stroke-width="1.75" stroke-linecap="round"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z" stroke-width="1.75" stroke-linejoin="round"/></symbol>
  <symbol id="i-dash" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" stroke-width="1.75" stroke-dasharray="3 4"/></symbol>
  <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z" stroke-width="1.75" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.4" stroke-width="1.75"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 10a6 6 0 1 1 12 0c0 4 1.5 5 1.5 5h-15S6 14 6 10z" stroke-width="1.75" stroke-linejoin="round"/><path d="M10 18a2 2 0 0 0 4 0" stroke-width="1.75"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-5H9v5H5a1 1 0 0 1-1-1z" stroke-width="1.75" stroke-linejoin="round"/></symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="15" rx="2" stroke-width="1.75"/><path d="M4 10h16M8 3.5v4M16 3.5v4" stroke-width="1.75" stroke-linecap="round"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="9" r="3" stroke-width="1.75"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0" stroke-width="1.75" stroke-linecap="round"/><path d="M16 7.5a3 3 0 1 1 3.2 3M15 13.2A5.2 5.2 0 0 1 20.5 19" stroke-width="1.75" stroke-linecap="round"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.5" stroke-width="1.75"/><path d="M4.5 19.5a7.5 7.5 0 0 1 15 0" stroke-width="1.75" stroke-linecap="round"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.4" stroke-width="1.75"/><circle cx="6" cy="12" r="2.4" stroke-width="1.75"/><circle cx="18" cy="19" r="2.4" stroke-width="1.75"/><path d="M8.2 10.8l7.6-4.2M8.2 13.2l7.6 4.2" stroke-width="1.75"/></symbol>
  <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M7 4h10v4a5 5 0 0 1-10 0z" stroke-width="1.75" stroke-linejoin="round"/><path d="M12 13v3m-3 3h6" stroke-width="1.75" stroke-linecap="round"/><path d="M7 5H4v2a3 3 0 0 0 3 3M17 5h3v2a3 3 0 0 1-3 3" stroke-width="1.75"/></symbol>
  <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z" stroke-width="1.4" stroke-linejoin="round"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.2" stroke-width="1.75"/><path d="M12 7.5V12l3 2" stroke-width="1.75" stroke-linecap="round"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" stroke-width="1.75"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3.9a7 7 0 0 0-2.1-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2.1 1.2l-2.3-.9-2 3.4 2 1.5A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.4 2.3-.9a7 7 0 0 0 2.1 1.2L10 21h4l.5-2.6a7 7 0 0 0 2.1-1.2l2.3.9 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z" stroke-width="1.3" stroke-linejoin="round"/></symbol>
</svg>
{% if flashes %}
<div class="flash-stack">
  {% for f in flashes %}
  <span class="toast {% if f.kind == 'success' %}toast--success{% elif f.kind == 'error' %}toast--error{% endif %}">{{ t(f.message) }}</span>
  {% endfor %}
</div>
{% endif %}
<div style="flex:1;overflow-y:auto;padding:var(--space-5) var(--space-5) var(--space-6);max-width:520px;margin:0 auto;width:100%;box-sizing:border-box">
{% block content %}{% endblock %}
</div>
{% block nav %}{% include "_bottom_nav.html" %}{% endblock %}
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("/static/sw.js").catch(() => {}));
  }
</script>
</body>
</html>
