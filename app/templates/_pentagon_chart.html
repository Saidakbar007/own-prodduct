{# Пятиугольная диаграмма 5 сфер героя. Ожидает переменную `chart` (из pentagon_chart()). #}
<svg viewBox="0 0 {{ chart.size }} {{ chart.size }}" class="w-full max-w-[280px] mx-auto" role="img" aria-label="Диаграмма сфер героя">
    {% for ring in chart.grid_rings %}
    <polygon points="{{ ring }}" fill="none" stroke="var(--line)" stroke-width="1"></polygon>
    {% endfor %}
    {% for ax in chart.axis_lines %}
    <line x1="{{ chart.center }}" y1="{{ chart.center }}" x2="{{ ax[0] }}" y2="{{ ax[1] }}" stroke="var(--line)" stroke-width="1"></line>
    {% endfor %}

    <polygon points="{{ chart.data_polygon }}" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2"></polygon>

    {% for label in chart.labels %}
    <text x="{{ label.x }}" y="{{ label.y }}" text-anchor="middle" dominant-baseline="middle"
          class="font-mono" style="font-size:9px; fill: var(--muted); letter-spacing: 0.04em;" data-sphere="{{ label.code }}">
        {{ label.name }} {{ label.level }}
    </text>
    {% endfor %}
</svg>
