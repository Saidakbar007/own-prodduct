{% extends "base.html" %}

{% block title %}AI-коуч — Моя жизнь{% endblock %}

{% block content %}
<section class="max-w-md mx-auto">
    <h1 class="text-xl font-bold mb-4 flex items-center gap-2"><i data-lucide="bot"></i> AI-коуч</h1>

    <div class="space-y-3 mb-4 max-h-[60vh] overflow-y-auto">
        {% for msg in history %}
        {% if msg.role == "user" %}
        <div class="bg-[var(--accent-soft)] rounded-xl px-4 py-3 text-sm ml-8">
            <b>Ты:</b> {{ msg.text }}
        </div>
        {% else %}
        <div class="bg-[var(--card)] border border-[var(--line)] rounded-xl px-4 py-3 text-sm mr-8">
            <b>Коуч:</b> {{ msg.text }}
        </div>
        {% endif %}
        {% endfor %}
    </div>

    <form method="post" action="/coach" class="space-y-2">
        <textarea name="question" rows="2" placeholder="Спроси что-нибудь у коуча..."
                  class="w-full border border-[var(--line)] bg-[var(--sunken)] text-[var(--text)] rounded-lg px-3 py-2"></textarea>
        <button type="submit"
                class="btn-press w-full bg-[var(--accent)] text-white rounded-lg py-2.5 font-medium hover:opacity-90">
            Спросить
        </button>
    </form>
</section>
{% endblock %}
