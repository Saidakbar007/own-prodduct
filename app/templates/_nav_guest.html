<header class="bg-[var(--card)] border-b border-[var(--line)] text-[var(--text)] sticky top-0 z-20">
    <nav class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
        <a href="/" class="font-display text-lg font-bold flex items-center gap-2 shrink-0 text-[var(--accent)]">
            <i data-lucide="rocket"></i> <span class="hidden sm:inline">Моя жизнь</span>
        </a>
        <div class="flex items-center gap-2 sm:gap-3">
            <div class="relative">
                <button type="button" data-more-toggle onclick="toggleMoreMenu()" class="p-2 rounded-lg hover:bg-[var(--sunken)]" aria-label="Тема">
                    <i data-lucide="sun-moon"></i>
                </button>
                <div class="more-menu absolute right-0 mt-2 w-44 bg-[var(--card)] text-[var(--text)] rounded-xl shadow-lg border border-[var(--line)] py-1 text-sm">
                    <button data-theme-option="light" class="w-full text-left px-3 py-2 hover:bg-[var(--sunken)] flex items-center gap-2"><i data-lucide="sun"></i> Светлая</button>
                    <button data-theme-option="dark" class="w-full text-left px-3 py-2 hover:bg-[var(--sunken)] flex items-center gap-2"><i data-lucide="moon"></i> Тёмная</button>
                    <button data-theme-option="system" class="w-full text-left px-3 py-2 hover:bg-[var(--sunken)] flex items-center gap-2"><i data-lucide="monitor"></i> Как в системе</button>
                </div>
            </div>
            <a href="/login" class="text-sm font-medium hover:text-[var(--accent)] shrink-0">Войти</a>
            <a href="/register" class="btn-press bg-[var(--accent)] text-white text-sm font-semibold px-3 sm:px-4 py-2 rounded-lg hover:opacity-90 shrink-0 whitespace-nowrap">
                Регистрация
            </a>
        </div>
    </nav>
</header>
