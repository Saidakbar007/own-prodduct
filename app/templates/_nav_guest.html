<header class="bg-[var(--bg-2)] border-b border-[var(--line)] text-[var(--text)] sticky top-0 z-20">
    <nav class="max-w-6xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between gap-3">
        <a href="/" class="font-display text-base font-extrabold flex items-center gap-2 shrink-0">
            <span class="w-7 h-7 rounded-lg bg-[var(--accent)] text-[var(--on-accent)] flex items-center justify-center shrink-0">
                <i data-lucide="compass" style="width:1em;height:1em;"></i>
            </span>
            <span class="hidden sm:inline">Моя жизнь</span>
        </a>
        <div class="flex items-center gap-2 sm:gap-3">
            <div class="relative">
                <button type="button" data-more-toggle onclick="toggleMoreMenu()" class="p-2 rounded-[var(--radius-sm)] hover:bg-[var(--hover)]" aria-label="Тема">
                    <i data-lucide="sun-moon"></i>
                </button>
                <div class="more-menu absolute right-0 mt-2 w-44 card py-1 text-sm shadow-lg">
                    <button data-theme-option="light" class="w-full text-left px-3 py-2 hover:bg-[var(--hover)] flex items-center gap-2"><i data-lucide="sun"></i> Светлая</button>
                    <button data-theme-option="dark" class="w-full text-left px-3 py-2 hover:bg-[var(--hover)] flex items-center gap-2"><i data-lucide="moon"></i> Тёмная</button>
                    <button data-theme-option="system" class="w-full text-left px-3 py-2 hover:bg-[var(--hover)] flex items-center gap-2"><i data-lucide="monitor"></i> Как в системе</button>
                </div>
            </div>
            <a href="/login" class="text-sm font-medium hover:text-[var(--accent)] shrink-0">Войти</a>
            <a href="/register" class="btn btn-primary btn-press shrink-0">
                Регистрация
            </a>
        </div>
    </nav>
</header>
