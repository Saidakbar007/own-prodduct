{% extends "base.html" %}

{% block title %}Напарники — Моя жизнь{% endblock %}

{% block content %}
<section class="max-w-md mx-auto">
    <h1 class="text-xl font-bold mb-4 flex items-center gap-2"><i data-lucide="handshake"></i> Предложения напарника</h1>

    <div class="space-y-3">
        {% for p in incoming %}
        <div class="card p-4">
            <p class="text-sm text-[var(--muted)] mb-2">Предложение #{{ p.id }} — выбери свою привычку для общей серии</p>
            <form method="post" action="/partnerships/{{ p.id }}/accept" class="flex gap-2 mb-2">
                <select name="habit_id" required class="flex-1 border border-[var(--line)] bg-[var(--sunken)] text-[var(--text)] rounded-lg px-3 py-2 text-sm">
                    {% for h in my_habits %}
                    <option value="{{ h.id }}">{{ h.name }}</option>
                    {% endfor %}
                </select>
                <button type="submit" class="btn-press bg-[var(--success)] text-[var(--on-accent)] rounded-lg px-4 py-2 text-sm hover:opacity-90">
                    Принять
                </button>
            </form>
            <form method="post" action="/partnerships/{{ p.id }}/decline">
                <button type="submit" class="text-sm text-[var(--muted)] hover:text-[var(--text)]">Отклонить</button>
            </form>
        </div>
        {% else %}
        <div class="card border-dashed p-8 text-center">
            <i data-lucide="handshake" class="mx-auto mb-2 text-[var(--muted)]" style="width:2rem;height:2rem;"></i>
            <p class="text-[var(--muted)] text-sm">Пока нет предложений напарника</p>
        </div>
        {% endfor %}
    </div>
</section>
{% endblock %}
