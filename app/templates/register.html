{% extends "base.html" %}

{% block title %}Регистрация — Моя жизнь{% endblock %}

{% block content %}
<section class="max-w-md mx-auto bg-white rounded-xl border border-slate-200 p-6 mt-8">
    <h1 class="text-xl font-bold mb-4">Регистрация</h1>

    {% if error %}
    <div class="bg-red-50 text-red-700 text-sm rounded-lg px-3 py-2 mb-4">
        {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/register" class="space-y-3">
        <div>
            <label class="block text-sm font-medium mb-1">Имя</label>
            <input type="text" name="name" required
                   class="w-full border border-slate-300 rounded-lg px-3 py-2">
        </div>

        <div class="grid grid-cols-2 gap-3">
            <div>
                <label class="block text-sm font-medium mb-1">Возраст</label>
                <input type="number" name="age" min="1"
                       class="w-full border border-slate-300 rounded-lg px-3 py-2">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Пол</label>
                <select name="gender" class="w-full border border-slate-300 rounded-lg px-3 py-2">
                    <option value="">Не указан</option>
                    <option value="male">Мужской</option>
                    <option value="female">Женский</option>
                </select>
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium mb-1">Почта</label>
            <input type="email" name="mail" required
                   class="w-full border border-slate-300 rounded-lg px-3 py-2">
        </div>

        <div>
            <label class="block text-sm font-medium mb-1">Логин</label>
            <input type="text" name="login" required
                   class="w-full border border-slate-300 rounded-lg px-3 py-2">
        </div>

        <div>
            <label class="block text-sm font-medium mb-1">Пароль</label>
            <input type="password" name="password" required
                   class="w-full border border-slate-300 rounded-lg px-3 py-2">
        </div>

        <div>
            <label class="block text-sm font-medium mb-1">Повторите пароль</label>
            <input type="password" name="password_confirm" required
                   class="w-full border border-slate-300 rounded-lg px-3 py-2">
        </div>

        <button type="submit"
                class="w-full bg-indigo-600 text-white rounded-lg py-2.5 font-medium hover:bg-indigo-700">
            Создать аккаунт
        </button>
    </form>

    <p class="text-sm text-slate-500 text-center mt-4">
        Уже есть аккаунт? <a href="/login" class="text-indigo-600 font-medium">Войти</a>
    </p>
</section>
{% endblock %}
