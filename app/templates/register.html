{% extends "base.html" %}
{% block title %}{{ t('auth.register_title') }} — {{ t('common.app_name') }}{% endblock %}
{% block content %}
<div class="card auth-card">
  <h1 style="font-size:var(--text-xl);margin-bottom:var(--space-5)">{{ t('auth.register_title') }}</h1>

  {% if error %}<p class="form-error">{{ t(error) }}</p>{% endif %}

  <form method="post" action="/register">
    <div class="field">
      <label for="name">{{ t('auth.name_label') }}</label>
      <input id="name" name="name" type="text" required autocomplete="name" />
    </div>
    <div class="field">
      <label for="birth_year">{{ t('auth.birth_year_label') }}</label>
      <input id="birth_year" name="birth_year" type="number" min="1900" max="2026" required />
    </div>
    <div class="field">
      <label for="email">{{ t('auth.email_label') }}</label>
      <input id="email" name="email" type="email" required autocomplete="email" />
    </div>
    <div class="field">
      <label for="login">{{ t('auth.login_label') }}</label>
      <input id="login" name="login" type="text" required autocomplete="username" />
    </div>
    <div class="field">
      <label for="password">{{ t('auth.password_label') }}</label>
      <input id="password" name="password" type="password" required autocomplete="new-password" />
    </div>
    <div class="field">
      <label for="password_confirm">{{ t('auth.password_confirm_label') }}</label>
      <input id="password_confirm" name="password_confirm" type="password" required autocomplete="new-password" />
    </div>
    <label class="checkbox-field">
      <input type="checkbox" name="age_confirm" value="1" required />
      <span>{{ t('auth.age_confirm_label') }}</span>
    </label>

    <input type="hidden" name="timezone" id="timezone" value="UTC" />

    <button class="btn btn--primary btn--block" type="submit">{{ t('auth.submit_register') }}</button>
  </form>

  <p class="auth-switch">{{ t('auth.have_account') }} <a href="/login">{{ t('auth.go_login') }}</a></p>
</div>

<script>
  document.getElementById('timezone').value = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';
</script>
{% endblock %}
