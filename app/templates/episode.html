{% extends "shell_base.html" %}
{% block title %}Серия {{ episode.week_number }} — {{ season.title }}{% endblock %}
{% block content %}
{% set active = 'season' %}
<div class="home-hero" style="padding:var(--space-4) 0 var(--space-5);text-align:left">
  <h1 style="font-size:var(--text-xl)">Серия {{ episode.week_number }}</h1>
  <p>{{ episode.title }}</p>
</div>

<img src="/season/{{ season.id }}/episode/{{ episode.week_number }}/card.png" alt="{{ episode.title }}" style="width:100%;border-radius:var(--radius-lg);margin-bottom:var(--space-5)" />

<a class="btn btn--primary btn--block" href="/season/{{ season.id }}/episode/{{ episode.week_number }}/card.png" download>Поделиться</a>
<a class="btn btn--text" href="/season" style="display:block;text-align:center;margin-top:var(--space-4)">К сезону</a>
{% endblock %}
