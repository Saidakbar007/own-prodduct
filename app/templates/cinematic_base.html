<!doctype html>
<html lang="{{ lang }}" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{% block title %}{{ t('common.app_name') }}{% endblock %}</title>
<link rel="stylesheet" href="/design/tokens.css" />
<link rel="stylesheet" href="/design/base.css" />
<link rel="stylesheet" href="/design/components.css" />
<link rel="stylesheet" href="/design/screens/screens.css" />
<link rel="stylesheet" href="/static/app.css" />
</head>
<body style="min-height:100dvh">
<svg class="sr-only" aria-hidden="true">
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z" stroke-width="1.75" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.4" stroke-width="1.75"/></symbol>
  <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M7 4h10v4a5 5 0 0 1-10 0z" stroke-width="1.75" stroke-linejoin="round"/><path d="M12 13v3m-3 3h6" stroke-width="1.75" stroke-linecap="round"/><path d="M7 5H4v2a3 3 0 0 0 3 3M17 5h3v2a3 3 0 0 1-3 3" stroke-width="1.75"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.4" stroke-width="1.75"/><circle cx="6" cy="12" r="2.4" stroke-width="1.75"/><circle cx="18" cy="19" r="2.4" stroke-width="1.75"/><path d="M8.2 10.8l7.6-4.2M8.2 13.2l7.6 4.2" stroke-width="1.75"/></symbol>
  <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z" stroke-width="1.4" stroke-linejoin="round"/></symbol>
</svg>
{% if flashes %}
<div class="flash-stack">
  {% for f in flashes %}
  <span class="toast {% if f.kind == 'success' %}toast--success{% elif f.kind == 'error' %}toast--error{% endif %}">{{ t(f.message) }}</span>
  {% endfor %}
</div>
{% endif %}
{% block content %}{% endblock %}
</body>
</html>
