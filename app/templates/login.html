{% extends "base.html" %}

{% block title %}Вход — Моя жизнь{% endblock %}

{% block content %}
<section class="max-w-md mx-auto bg-[var(--card)] rounded-xl border border-[var(--line)] p-6 mt-8">
    <h1 class="text-xl font-bold mb-4">Вход</h1>

    {% if error %}
    <div class="bg-[var(--danger-soft)] text-[var(--danger)] text-sm rounded-lg px-3 py-2 mb-4 flex items-center gap-2">
        <i data-lucide="alert-triangle" class="shrink-0" style="width:1em;height:1em;"></i> {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/login" class="space-y-3">
        <div>
            <label class="block text-sm font-medium mb-1">Логин</label>
            <input type="text" name="login" required
                   class="w-full border border-[var(--line)] bg-[var(--sunken)] text-[var(--text)] rounded-lg px-3 py-2">
        </div>

        <div>
            <label class="block text-sm font-medium mb-1">Пароль</label>
            <input type="password" name="password" required
                   class="w-full border border-[var(--line)] bg-[var(--sunken)] text-[var(--text)] rounded-lg px-3 py-2">
        </div>

        <button type="submit"
                class="w-full bg-[var(--accent)] text-white rounded-lg py-2.5 font-medium hover:opacity-90">
            Войти
        </button>
    </form>

    <p class="text-sm text-[var(--muted)] text-center mt-4">
        Нет аккаунта? <a href="/register" class="text-[var(--accent)] font-medium">Зарегистрироваться</a>
    </p>
</section>
{% endblock %}
