{% extends "base.html" %}
{% block title %}{{ t('auth.login_title') }} — {{ t('common.app_name') }}{% endblock %}
{% block content %}
<div class="card auth-card">
  <h1 style="font-size:var(--text-xl);margin-bottom:var(--space-5)">{{ t('auth.login_title') }}</h1>

  {% if error %}<p class="form-error">{{ t(error) }}</p>{% endif %}

  <form method="post" action="/login">
    <div class="field">
      <label for="login">{{ t('auth.login_label') }}</label>
      <input id="login" name="login" type="text" required autocomplete="username" />
    </div>
    <div class="field">
      <label for="password">{{ t('auth.password_label') }}</label>
      <input id="password" name="password" type="password" required autocomplete="current-password" />
    </div>

    <button class="btn btn--primary btn--block" type="submit">{{ t('auth.submit_login') }}</button>
  </form>

  <p class="auth-switch">{{ t('auth.no_account') }} <a href="/register">{{ t('auth.go_register') }}</a></p>
</div>
{% endblock %}
