{% extends "base.html" %}

{% block title %}Вход — Моя жизнь{% endblock %}

{% block content %}
<section class="max-w-md mx-auto bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 p-6 mt-8">
    <h1 class="text-xl font-bold mb-4">Вход</h1>

    {% if error %}
    <div class="bg-red-50 dark:bg-red-950 text-red-700 dark:text-red-300 text-sm rounded-lg px-3 py-2 mb-4 flex items-center gap-2">
        <i data-lucide="alert-triangle" class="shrink-0" style="width:1em;height:1em;"></i> {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/login" class="space-y-3">
        <div>
            <label class="block text-sm font-medium mb-1">Логин</label>
            <input type="text" name="login" required
                   class="w-full border border-slate-300 dark:border-slate-600 rounded-lg px-3 py-2 dark:bg-slate-700 dark:text-slate-100">
        </div>

        <div>
            <label class="block text-sm font-medium mb-1">Пароль</label>
            <input type="password" name="password" required
                   class="w-full border border-slate-300 dark:border-slate-600 rounded-lg px-3 py-2 dark:bg-slate-700 dark:text-slate-100">
        </div>

        <button type="submit"
                class="w-full bg-indigo-600 text-white rounded-lg py-2.5 font-medium hover:bg-indigo-700">
            Войти
        </button>
    </form>

    <p class="text-sm text-slate-500 dark:text-slate-400 text-center mt-4">
        Нет аккаунта? <a href="/register" class="text-indigo-600 dark:text-indigo-400 font-medium">Зарегистрироваться</a>
    </p>
</section>
{% endblock %}
