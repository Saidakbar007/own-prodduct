id: keep_in_touch
version: 1
title: "Сезон: поддерживать связи"
title_uz: "Mavsum: aloqalarni saqlab turish"
category: social
metric: { name: "Контакты с близкими", unit: "контактов/нед", direction: up }
lengths: [30, 60]
target_default: 3
baseline_test:
  prompt: "Сколько раз на прошлой неделе ты сам(а) связался(ась) с близким человеком (звонок или встреча)?"
  input: number
  min: 0
  max: 14
eligibility:
  min_age: 18
  warnings: []
schedule: { train_days: [1, 3, 5, 7], minutes: [2, 15] }
phases:
  - phase: 1
    unlock_if_baseline_gte: 0
    days:
      - title: "По кругу из 5 человек"
        instructions: "Составь список из 5 близких людей. По кругу связывайся с одним из них — звонок, встреча или хотя бы сообщение."
        minimal: "1 короткое сообщение"
        expected_progress: 1
rest_day:
  title: "Обычный день"
  instructions: "Связываться с кем-то не обязательно каждый день — считаются только отмеченные дни"
measure_every_days: 7
measure:
  prompt: "Со сколькими близкими ты связался(ась) на этой неделе?"
  proof: optional
  progress_photo: false
safety:
  max_phase_jump: 1
  rest_days_min_per_week: 0
