id: nutrition
version: 1
title: "Сезон: питание"
title_uz: "Mavsum: ovqatlanish"
category: nutrition
metric: { name: "Овощи и фрукты", unit: "порций/день", direction: up }
lengths: [30, 60]
target_default: 2
baseline_test:
  prompt: "Сколько порций овощей и фруктов ты ешь в среднем за день? (горсть = 1 порция)"
  input: number
  min: 0
  max: 10
eligibility:
  min_age: 18
  warnings:
    - "При диагностированных нарушениях питания — сначала обратись к специалисту; это не план похудения"
schedule: { train_days: [1, 2, 3, 4, 5, 6, 7], minutes: [5, 10] }
phases:
  - phase: 1
    unlock_if_baseline_gte: 0
    days:
      - title: "Овощи и фрукты к каждому приёму"
        instructions: "Добавляй минимум одну порцию овощей или фруктов к каждому приёму пищи (горсть = 1 порция)."
        minimal: "Одна дополнительная порция в день"
        expected_progress: 0.3
rest_day:
  title: "Обычный день"
  instructions: "Привычка работает каждый день, включая выходные"
measure_every_days: 7
measure:
  prompt: "Сколько порций овощей и фруктов ты съедал(а) в среднем за день на этой неделе?"
  proof: optional
  progress_photo: false
safety:
  max_phase_jump: 1
  rest_days_min_per_week: 0
