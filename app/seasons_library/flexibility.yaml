id: flexibility
version: 1
title: "Сезон: гибкость"
title_uz: "Mavsum: moslashuvchanlik"
category: fitness
metric: { name: "Растяжка", unit: "сессий/нед", direction: up }
lengths: [30, 60]
target_default: 2
baseline_test:
  prompt: "Сколько раз в неделю ты делаешь растяжку сейчас?"
  input: number
  min: 0
  max: 14
eligibility:
  min_age: 18
  warnings:
    - "Растягивайся до лёгкого натяжения, без боли; при травмах суставов — сначала проконсультируйся с врачом"
schedule: { train_days: [2, 4, 6], minutes: [10, 20] }
phases:
  - phase: 1
    unlock_if_baseline_gte: 0
    days:
      - title: "Растяжка всего тела"
        instructions: "10–15 минут: шея, плечи, спина, бёдра, икры. Задержка в каждой позе 20–30 сек, без боли."
        minimal: "5 минут растяжки ног и спины"
        expected_progress: 0.3
rest_day:
  title: "Обычный день"
  instructions: "Растяжка не ежедневно — в остальные дни просто лёгкая прогулка или отдых"
measure_every_days: 7
measure:
  prompt: "Сколько раз на этой неделе ты делал(а) растяжку?"
  proof: optional
  progress_photo: false
safety:
  max_phase_jump: 1
  rest_days_min_per_week: 1
