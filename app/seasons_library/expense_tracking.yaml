id: expense_tracking
version: 1
title: "Сезон: учёт расходов"
title_uz: "Mavsum: xarajatlarni hisobga olish"
category: finance
metric: { name: "Доля дней с записанными тратами", unit: "%", direction: up }
lengths: [30, 60]
target_default: 80
baseline_test:
  prompt: "В какой % дней за последнюю неделю ты записывал(а) все траты?"
  input: number
  min: 0
  max: 100
eligibility:
  min_age: 18
  warnings: []
schedule: { train_days: [1, 2, 3, 4, 5, 6, 7], minutes: [1, 3] }
phases:
  - phase: 1
    unlock_if_baseline_gte: 0
    days:
      - title: "Запиши все траты дня"
        instructions: "В течение дня отмечай каждую трату одной кнопкой-категорией — не нужно вспоминать всё вечером, фиксируй по ходу дня."
        minimal: "Записать хотя бы 1 трату"
        expected_progress: 14
rest_day:
  title: "Воскресенье — итог"
  instructions: "Посмотри итог недели по категориям, без новых записей — просто обзор"
measure_every_days: 7
measure:
  prompt: "В какой % дней на этой неделе ты записывал(а) все траты?"
  proof: optional
  progress_photo: false
safety:
  max_phase_jump: 1
  rest_days_min_per_week: 0
