id: pushups_50
version: 1
title: "Сезон: 50 отжиманий подряд"
title_uz: "Mavsum: 50 marta qoʻl bukib tushish"
category: fitness
metric: { name: "Отжимания подряд", unit: "повторения", direction: up }
lengths: [30, 60]
target_default: 50
baseline_test:
  prompt: "Сколько полных отжиманий (от пола, грудь почти касается пола) ты можешь сделать подряд?"
  input: number
  min: 0
  max: 55
eligibility:
  min_age: 18
  warnings:
    - "При болях в запястьях или плечах — сначала проконсультируйся с врачом"
schedule: { train_days: [1, 3, 5], minutes: [15, 25] }
phases:
  - phase: 1
    unlock_if_baseline_gte: 0
    days:
      - title: "Отжимания от опоры"
        instructions: "5 подходов отжиманий от стены или стола по 10–12 повторений, отдых 60 сек."
        minimal: "3 подхода от стены по 8 повторений"
        expected_progress: 0.3
  - phase: 2
    unlock_if_baseline_gte: 5
    days:
      - title: "Отжимания с колен"
        instructions: "5 подходов отжиманий с колен по 10 повторений, отдых 60–90 сек, следим за прямой спиной."
        minimal: "3 подхода с колен по 6 повторений"
        expected_progress: 0.4
  - phase: 3
    unlock_if_baseline_gte: 15
    days:
      - title: "Полные отжимания — объём"
        instructions: "5 подходов полных отжиманий на 70% от максимума повторений, отдых 90 сек."
        minimal: "3 подхода по 5 полных отжиманий"
        expected_progress: 0.6
  - phase: 4
    unlock_if_baseline_gte: 30
    days:
      - title: "Полные отжимания — сила"
        instructions: "6 подходов полных отжиманий на 70–80% от максимума, отдых 2 минуты между подходами."
        minimal: "4 подхода по 10 полных отжиманий"
        expected_progress: 0.5
  - phase: 5
    unlock_if_baseline_gte: 42
    days:
      - title: "Полировка результата"
        instructions: "Разминка. 1 подход на максимум подряд, затем 4 подхода по 60% от максимума с полным восстановлением."
        minimal: "1 подход на максимум подряд"
        expected_progress: 0.3
rest_day:
  title: "День восстановления"
  instructions: "Растяжка плеч и груди 10 минут или лёгкая прогулка"
measure_every_days: 7
measure:
  prompt: "Сколько полных отжиманий подряд получилось сегодня?"
  proof: optional
  progress_photo: false
safety:
  max_phase_jump: 1
  rest_days_min_per_week: 1
