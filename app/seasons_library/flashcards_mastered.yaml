id: flashcards_mastered
version: 1
title: "Сезон: карточки, усвоенные надолго"
title_uz: "Mavsum: uzoq muddatga oʻzlashtirilgan kartochkalar"
category: knowledge
metric: { name: "Усвоенные карточки за неделю", unit: "карточек/нед", direction: up }
lengths: [30, 60]
target_default: 50
baseline_test:
  prompt: "Сколько карточек ты сейчас уверенно помнишь и повторяешь за неделю?"
  input: number
  min: 0
  max: 200
eligibility:
  min_age: 18
  warnings: []
schedule: { train_days: [1, 2, 3, 4, 5, 6, 7], minutes: [10, 15] }
phases:
  - phase: 1
    unlock_if_baseline_gte: 0
    days:
      - title: "Повторение карточек"
        instructions: >-
          Повтори карточки, которые система показывает на сегодня — новые
          (не больше 15) и те, что пора повторить. Отвечай честно: если не
          вспомнил, карточка должна вернуться раньше по графику.
        minimal: "5 карточек"
        expected_progress: 5
rest_day:
  title: "День без новых карточек"
  instructions: "Повтори только карточки на повторение, без новых — это тоже засчитывается"
measure_every_days: 7
measure:
  prompt: "Сколько карточек на этой неделе ты вспомнил уверенно при интервале 21+ день?"
  proof: optional
  progress_photo: false
safety:
  max_phase_jump: 1
  rest_days_min_per_week: 0
