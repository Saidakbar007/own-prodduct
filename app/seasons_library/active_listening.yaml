id: active_listening
version: 1
title: "Сезон: активное слушание"
title_uz: "Mavsum: faol tinglash"
category: social
metric: { name: "Разговоры с перефразом", unit: "раз/нед", direction: up }
lengths: [30, 60]
target_default: 4
baseline_test:
  prompt: "Сколько раз за последнюю неделю ты пересказывал(а) слова собеседника своими словами, чтобы проверить, что понял(а) правильно?"
  input: number
  min: 0
  max: 14
eligibility:
  min_age: 18
  warnings: []
schedule: { train_days: [1, 2, 3, 4, 5, 6, 7], minutes: [1, 5] }
phases:
  - phase: 1
    unlock_if_baseline_gte: 0
    days:
      - title: "Перефраз в разговоре"
        instructions: "В разговоре хотя бы раз скажи: «Правильно понимаю, что…?» — и дождись ответа собеседника."
        minimal: "1 перефраз в день"
        expected_progress: 0.5
rest_day:
  title: "Обычный день"
  instructions: "Техника применяется в любом разговоре, который случится — специально искать не нужно"
measure_every_days: 7
measure:
  prompt: "В скольких разговорах на этой неделе ты применил(а) перефраз?"
  proof: optional
  progress_photo: false
safety:
  max_phase_jump: 1
  rest_days_min_per_week: 0
