id: beat_procrastination
version: 1
title: "Сезон: убрать прокрастинацию"
title_uz: "Mavsum: ishni keyinga qoldirmaslik"
category: character
metric: { name: "Задачи, начатые вовремя", unit: "задач/нед", direction: up }
lengths: [30, 60]
target_default: 4
baseline_test:
  prompt: "Сколько раз за последнюю неделю ты начал(а) задачу ровно в то время, которое сам(а) запланировал(а)?"
  input: number
  min: 0
  max: 14
eligibility:
  min_age: 18
  warnings: []
schedule: { train_days: [1, 2, 3, 4, 5, 6, 7], minutes: [2, 10] }
phases:
  - phase: 1
    unlock_if_baseline_gte: 0
    days:
      - title: "Старт в ЧЧ:ММ"
        instructions: "Каждое утро выбери одну задачу и точное время старта. Когда время пришло — начни, даже если не готов(а) на 100%."
        minimal: "Открыть файл задачи"
        expected_progress: 0.5
rest_day:
  title: "Обычный день"
  instructions: "Привычка работает каждый день, включая выходные"
measure_every_days: 7
measure:
  prompt: "Сколько задач на этой неделе ты начал(а) в запланированное время?"
  proof: optional
  progress_photo: false
safety:
  max_phase_jump: 1
  rest_days_min_per_week: 0
