id: live_by_values
version: 1
title: "Сезон: жить по ценностям"
title_uz: "Mavsum: qadriyatlarga mos yashash"
category: values
metric: { name: "Действия по ценностям", unit: "действий/нед", direction: up }
lengths: [60, 90]
target_default: 3
baseline_test:
  prompt: "Сколько раз за последнюю неделю ты осознанно выбрал(а) действие, которое отражает одну из твоих ценностей?"
  input: number
  min: 0
  max: 14
eligibility:
  min_age: 18
  warnings: []
schedule: { train_days: [1, 2, 3, 4, 5, 6, 7], minutes: [2, 10] }
phases:
  - phase: 1
    unlock_if_baseline_gte: 0
    days:
      - title: "Ценность недели"
        instructions: "В понедельник выбери 1 ценность из своих трёх важных. Каждый день отмечай хотя бы 1 действие, которое ей соответствует."
        minimal: "Назвать 1 ценность утром"
        expected_progress: 0.5
rest_day:
  title: "Обычный день"
  instructions: "Ценность недели остаётся той же всю неделю, включая выходные"
measure_every_days: 7
measure:
  prompt: "Сколько действий по ценности недели получилось на этой неделе?"
  proof: optional
  progress_photo: false
safety:
  max_phase_jump: 1
  rest_days_min_per_week: 0
