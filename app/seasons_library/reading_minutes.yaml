id: reading_minutes
version: 1
title: "Сезон: чтение длинных текстов"
title_uz: "Mavsum: uzun matnlarni oʻqish"
category: mind
metric: { name: "Чтение", unit: "мин/нед", direction: up }
lengths: [30, 60]
target_default: 150
baseline_test:
  prompt: "Сколько минут в неделю ты сейчас читаешь длинные тексты (книги, статьи, без соцсетей)?"
  input: number
  min: 0
  max: 600
eligibility:
  min_age: 18
  warnings: []
schedule: { train_days: [1, 2, 3, 4, 5, 6], minutes: [10, 40] }
phases:
  - phase: 1
    unlock_if_baseline_gte: 0
    days:
      - title: "Чтение длинного текста"
        instructions: "Читай книгу или длинную статью 10–40 минут без соцсетей и уведомлений. Можно в любое удобное время дня."
        minimal: "1 страница"
        expected_progress: 5
rest_day:
  title: "Обычный день"
  instructions: "В день отдыха от чтения можно просто послушать аудиокнигу или отдохнуть от текстов"
measure_every_days: 7
measure:
  prompt: "Сколько минут ты читал(а) длинные тексты на этой неделе?"
  proof: optional
  progress_photo: false
safety:
  max_phase_jump: 1
  rest_days_min_per_week: 1
