    outcome: "В конце — есть стабильные вечера без работы и учёбы после условленного часа"
    metric: { key: offline_evenings, kind: counter, unit: "вечеров/нед", rounding: 1 }
    secondary: ["часы сна (при желании)"]
    targets: ["30 дней", "60 дней"]
    pace: "Варианты цели: 3 / 5 / 7 вечеров без работы и учёбы после условленного часа. +1 вечер за 2 недели (продуктовая эвристика)."
    week_skeleton: "Каждый день — выбранный «час выключения»"
    minimal_version: "Закрыть ноутбук, сказать «день окончен»"
    guide:
      steps:
        - ru: "Выбери конкретный «час выключения» (например 20:00), после которого не открываешь учебные и рабочие задачи — выбери реалистичный час, а не идеальный."
          uz: "Aniq 'o'chirish vaqti'ni tanlang (masalan, 20:00), undan keyin o'quv va ish vazifalarini ochmaysiz — ideal emas, real vaqtni tanlang."
        - ru: "Перед «часом выключения» выпиши короткий список дел на завтра — это снимает тревогу «а вдруг что-то забуду» и даёт разрешение остановиться."
          uz: "'O'chirish vaqti'dan oldin ertangi ishlar ro'yxatini qisqacha yozib qo'ying — bu 'birdan nimadir unutib qo'yaman' tashvishini olib tashlaydi va to'xtashga ruxsat beradi."
        - ru: "Сделай простой ритуал закрытия дня: закрыть ноутбук, убрать учебники со стола, проговорить «день окончен» — это сигнал мозгу переключиться."
          uz: "Kunni yopishning oddiy marosimini yarating: noutbukni yopish, darsliklarni stoldan olib qo'yish, 'kun tugadi' deyish — bu miyaga o'tish signali."
        - ru: "Считай вечер «выключенным», даже если просто закрыл ноутбук и сказал себе «день окончен» — минимальная версия тоже засчитывается в счётчик."
          uz: "Shunchaki noutbukni yopib, o'zingizga 'kun tugadi' deganingizda ham kechqurunni 'o'chirilgan' deb hisoblang — minimal versiya ham hisoblagichga kiradi."
        - ru: "Увеличивай число таких вечеров постепенно: +1 вечер за 2 недели, а не сразу все 7 дней подряд."
          uz: "Bunday kechqurunlar sonini asta-sekin oshiring: 2 haftada +1 kechqurun, darhol barcha 7 kunni emas."
      mistakes:
        - ru: "Ставить «час выключения» нереально рано (например в 18:00 при плотном графике пар) — такой час постоянно нарушается и демотивирует."
          uz: "'O'chirish vaqti'ni real bo'lmagan darajada erta qo'yish (masalan, band dars jadvalida soat 18:00) — bunday vaqt doim buziladi va rag'batni yo'qotadi."
        - ru: "Считать проверку учебных или рабочих сообщений «на минутку» не нарушением — одно короткое сообщение легко превращается в час работы."
          uz: "O'quv yoki ish xabarlarini 'bir daqiqaga' tekshirishni buzilish deb hisoblamaslik — bitta qisqa xabar oson ravishda bir soatlik ishga aylanadi."
        - ru: "Пытаться сразу ввести 7 «выключенных» вечеров в неделю при плотном графике — реалистичнее начать с 3 и постепенно добавлять."
          uz: "Band jadvalda darhol haftada 7 'o'chirilgan' kechqurunni joriy qilishga urinish — 3 tadan boshlab, asta-sekin qo'shish realroq."
      first_week_example:
        ru: "Пн/Ср/Пт/Вс — в 20:00 список дел на завтра, закрыть ноутбук, сказать «день окончен»; остальные дни — по возможности то же самое."
        uz: "Dush/Chor/Juma/Yak — soat 20:00 da ertangi ishlar ro'yxati, noutbukni yopish, 'kun tugadi' deyish; qolgan kunlarda — imkon qadar xuddi shunday."
