# Каталог целей сферы «Разум» (PRD 1.0). Источник:
# docs/content/NEWLIFE_1_0_CONTENT.md → «1. РАЗУМ (фокус, память, умение
# учиться)» → «B) Цели». Цель «Сон для мозга» из того же раздела сюда
# сознательно не включена — она по метрике дублирует sleep_consistency из
# content/spheres/body.yaml (тоже среднее часов сна за 7 дней), добавлять
# вторую почти такую же цель в другой сфере сочли избыточным.
sphere: mind
goals:
  - id: deep_focus
    sphere: mind
    title: { ru: "Глубокий фокус", uz: "Chuqur diqqat" }
    difficulty: "Средний уровень"
    for_whom: "Для тех, кто часто отвлекается на телефон во время учёбы или работы"
    outcome: "В конце — длинные блоки работы без отвлечений становятся нормой"
    metric: { key: deep_focus_minutes_week, kind: timer, unit: "мин/нед", rounding: 5 }
    secondary: ["число фокус-блоков за неделю", "доля блоков без прерываний, %"]
    targets: ["60 дней", "90 дней"]
    pace: >-
      60→150 / 150→300 / 300→500 мин/нед; длину блока увеличивать на 5 минут
      в неделю. Входящее уведомление, даже без ответа, более чем втрое
      повышает риск ошибки во время фокус-блока (Stothart 2015).
    week_skeleton: "5×25–50 минут в неделю"
    minimal_version: "2 минуты на одну задачу, телефон в другой комнате"
    guide:
      steps:
        - ru: "Выбери одну задачу и поставь таймер на 25 минут (или сколько осилишь сейчас) — никакой многозадачности."
          uz: "Bitta vazifani tanla va 25 daqiqaga taymer qo'y (yoki hozircha chidaganingcha) — multitasking yo'q."
        - ru: "Главное — выключить уведомления (это доказанно помогает); куда положить телефон (сумка, другая комната) — дополнительная, более слабая мера, но тоже дешёвая и полезная."
          uz: "Eng muhimi — bildirishnomalarni o'chirish (bu isbotlangan yordam beradi); telefonni qayerga qo'yish (sumka, boshqa xona) — qo'shimcha, kuchsizroq, lekin baribir arzon va foydali chora."
        - ru: "Если отвлёкся — нажми кнопку «отвлёкся»: блок не обнуляется, но помечается прерванным, а минуты до прерывания всё равно идут в счёт; просто продолжай без самокритики."
          uz: "Chalg'ib qolsang — 'chalg'idim' tugmasini bos: blok noldan boshlanmaydi, lekin 'uzilgan' deb belgilanadi, uzilishgacha bo'lgan daqiqalar baribir hisobga kiradi; shunchaki davom et, o'zingni ayblamay."
        - ru: "Каждую неделю прибавляй к длине блока около 5 минут."
          uz: "Har hafta blok uzunligiga taxminan 5 daqiqa qo'shib bor."
        - ru: "Делай 5 фокус-блоков в неделю, по возможности в одно и то же время дня."
          uz: "Haftada 5 ta diqqat blokini, imkon qadar kunning bir xil vaqtida bajar."
      mistakes:
        - ru: "Пытаться сразу сидеть час без перерыва — лучше несколько честных коротких блоков, чем один длинный с отвлечениями."
          uz: "Darhol bir soat tanaffussiz o'tirishga urinish — chalg'ishlar bilan uzun bitta blokdan ko'ra, bir necha halol qisqa blok yaxshiroq."
        - ru: "Держать телефон «на всякий случай» на столе рядом — даже выключенный экран всё равно притягивает внимание."
          uz: "Telefonni 'har ehtimolga qarshi' stol ustida yonda qoldirish — o'chirilgan ekran ham diqqatni tortadi."
        - ru: "Считать прерванный блок полностью непрерывным — в счёт идут только минуты до прерывания, иначе картина прогресса искажается."
          uz: "Uzilgan blokni to'liq uzluksiz deb hisoblash — faqat uzilishgacha bo'lgan daqiqalar hisobga kiradi, aks holda taraqqiyot manzarasi buziladi."
      first_week_example:
        ru: "5 раз в неделю — 25 минут одна задача, телефон в другой комнате; при отвлечении — кнопка «отвлёкся» и блок заново."
        uz: "Haftada 5 marta — 25 daqiqa bitta vazifa, telefon boshqa xonada; chalg'isang — 'chalg'idim' tugmasi va blok qaytadan."
    source:
      name: "Stothart 2015"
      url: "https://www.sciencedaily.com/releases/2015/07/150709133044.htm"
    template_id: deep_focus

  - id: self_check_study
    sphere: mind
    title: { ru: "Учиться через самопроверку", uz: "Oʻz-oʻzini tekshirish orqali oʻqish" }
    difficulty: "Для новичков"
    for_whom: "Для тех, кто обычно просто перечитывает конспект перед экзаменом"
    outcome: "В конце — большинство учебных сессий заканчиваются самопроверкой, а не перечитыванием"
    metric: { key: self_check_share, kind: percent, unit: "%", rounding: 1 }
    secondary: ["точность самопроверки, %"]
    targets: ["30 дней", "60 дней"]
    pace: >-
      30→70% / 70→90% сессий с самопроверкой вместо перечитывания;
      самопроверка — одна из техник «высокой полезности» (Dunlosky 2013), но
      эффект во многом зависит от обязательной сверки с конспектом после
      попытки (Yang 2021).
    week_skeleton: "4–5 учебных сессий в неделю"
    minimal_version: "Закрыть конспект и вспомнить 3 главные мысли"
    guide:
      steps:
        - ru: "После учебной сессии закрой конспект и вспомни главное своими словами, не подглядывая в текст."
          uz: "Dars sessiyasidan keyin konspektni yopib, asosiylarini matnga qaramasdan o'z so'zlaring bilan eslab ko'r."
        - ru: "После каждой сессии отмечай кнопкой — прошла она с самопроверкой или просто перечитыванием."
          uz: "Har bir sessiyadan keyin tugma bilan belgila — u o'z-o'zini tekshirish bilan o'tdimi yoki shunchaki qayta o'qish bilan."
        - ru: "Начни с 1–2 сессий в неделю с самопроверкой и постепенно доводи долю до большинства сессий."
          uz: "Haftada 1–2 ta o'z-o'zini tekshiruvchi sessiyadan boshla va ulushini asta-sekin ko'pchilik sessiyalargacha oshir."
        - ru: "Если не можешь вспомнить какой-то момент — найди его в конспекте и повтори именно его, а не весь материал заново."
          uz: "Biror joyni eslay olmasang — uni konspektda top va butun materialni emas, aynan o'shani qayta ko'r."
      mistakes:
        - ru: "Перечитывать конспект несколько раз подряд, принимая знакомый текст за настоящее знание — это создаёт ложное чувство уверенности."
          uz: "Konspektni ketma-ket bir necha marta qayta o'qish, tanish matnni haqiqiy bilim deb hisoblash — bu yolg'on ishonch hissini yaratadi."
        - ru: "Проверять себя сразу после прочтения, без паузы — так работает кратковременная память, а не реальное усвоение."
          uz: "O'qib bo'lishi bilanoq, tanaffussiz o'zini tekshirish — bu qisqa muddatli xotira ishlaydi, haqiqiy o'zlashtirish emas."
        - ru: "Оценивать себя «вспомнил» без реальной сверки с конспектом — без обратной связи самопроверка приносит намного меньше пользы."
          uz: "Konspekt bilan solishtirmasdan 'eslab qoldim' deb o'zini baholash — teskari aloqasiz o'z-o'zini tekshirish ancha kam foyda beradi."
      first_week_example:
        ru: "4–5 учебных сессий за неделю: после каждой — закрыть конспект, вспомнить 3 главные мысли, затем проверить себя по тексту."
        uz: "Haftada 4–5 ta dars sessiyasi: har birida — konspektni yopish, 3 asosiy fikrni eslash, keyin matn bo'yicha o'zini tekshirish."
    source:
      name: "Dunlosky 2013 / Yang 2021"
      url: "https://www.psychologicalscience.org/news/releases/which-study-strategies-make-the-grade.html"
    template_id: self_check_study

  - id: memory_retention
    sphere: mind
    title: { ru: "Память на изученное", uz: "Oʻrganilganni yodda saqlash" }
    difficulty: "Средний уровень"
    for_whom: "Для тех, кто забывает материал уже через неделю после изучения"
    outcome: "В конце — большая часть тем держится в памяти неделю и дольше"
    metric: { key: delayed_recall_accuracy, kind: percent, unit: "%", rounding: 1 }
    secondary: ["число проверенных тем"]
    targets: ["30 дней", "60 дней"]
    pace: >-
      50→70% / 70→85% точности при проверке через 7 дней; самопроверка после
      изучения работает лучше перечитывания — метаанализ 222 исследований в
      реальных классах, g=0,499 (Yang 2021). Цикл 4–8 недель.
    week_skeleton: "3×15 минут в неделю"
    minimal_version: "1 вопрос по вчерашней теме"
    guide:
      steps:
        - ru: "После изучения новой темы запланируй проверку через 7 дней, а не сразу в тот же день."
          uz: "Yangi mavzuni o'rganib bo'lgach, tekshirishni bir xil kunga emas, 7 kundan keyinga rejalashtir."
        - ru: "В день проверки закрой все материалы и попробуй ответить на вопросы по памяти, без подсказок."
          uz: "Tekshirish kunida barcha materiallarni yop va savollarga yordamsiz, xotiradan javob berishga harakat qil."
        - ru: "Отмечай, сколько вспомнил правильно — это и есть точность отложенной проверки."
          uz: "Nechta to'g'ri eslab qolganingni belgila — bu kechiktirilgan tekshiruv aniqligi."
        - ru: "Темы, которые забылись, повтори и поставь на повторную проверку через ещё 7 дней."
          uz: "Unutilgan mavzularni qayta ko'r va yana 7 kundan keyin tekshirishga qo'y."
      mistakes:
        - ru: "Проверять себя сразу после изучения — так результат выглядит лучше, чем реальное долгосрочное запоминание."
          uz: "O'rganib bo'lishi bilanoq o'zini tekshirish — natija haqiqiy uzoq muddatli esda qolishdan yaxshiroq ko'rinadi."
        - ru: "Смотреть ответ при первой же трудности, а не пытаться вспомнить до конца."
          uz: "Birinchi qiyinchilikda javobga qarash, oxirigacha eslashga harakat qilmaslik."
      first_week_example:
        ru: "3 раза в неделю по 15 минут — проверка тем, изученных неделю назад, без конспекта."
        uz: "Haftada 3 marta 15 daqiqa — bir hafta oldin o'rganilgan mavzularni konspektsiz tekshirish."
    source:
      name: "Yang 2021 / Dunlosky 2013"
      url: "https://pubmed.ncbi.nlm.nih.gov/33683913/"
    template_id: memory_retention

  - id: hard_tasks
    sphere: mind
    title: { ru: "Решать сложные задачи", uz: "Qiyin masalalarni yechish" }
    difficulty: "Средний уровень"
    for_whom: "Для тех, кто хочет тренировать мышление на нестандартных задачах"
    outcome: "В конце — в 2–3 раза больше решённых сложных задач в неделю"
    metric: { key: hard_tasks_week, kind: counter, unit: "шт/нед", rounding: 1 }
    secondary: ["доля задач, решённых без подсказки, %"]
    targets: ["60 дней", "90 дней"]
    pace: >-
      5→15 / 15→30 шт/нед; чередование типов задач в среднем даёт заметный
      эффект (g≈0,34 для математики, метаанализ 59 исследований — Brunmair &
      Richter 2019), но для словесного материала (словарь, определения)
      работает наоборот — там эффективнее блоки. Цикл 8 недель.
    week_skeleton: "4×20 минут в неделю"
    minimal_version: "Одна задача"
    guide:
      steps:
        - ru: "Сначала разберись в каждом типе задач отдельно (2–3 разобранных примера), а потом чередуй 2–3 типа вперемешку — так сложнее, но эффективнее одной темы подряд."
          uz: "Avval har bir masala turini alohida tushunib ol (2–3 ta tahlil qilingan misol), keyin 2–3 turni aralashtirib yech — bu qiyinroq, ammo bir xil mavzudan ko'ra samaraliroq."
        - ru: "Садись решать без немедленной подсказки — дай себе хотя бы 10–15 минут честной попытки."
          uz: "Darhol yordamga qaramay yecha boshla — o'zingga kamida 10–15 daqiqa halol urinish vaqtini ber."
        - ru: "Если застрял — попробуй другой подход, а не сразу открывай готовое решение."
          uz: "Tiqilib qolsang — darhol tayyor yechimni ochmay, boshqa yondashuvni sinab ko'r."
        - ru: "Отмечай каждую решённую задачу и помечай, использовал ли подсказку."
          uz: "Har bir yechilgan masalani belgila va yordam ishlatilganini qayd et."
        - ru: "Увеличивай число задач в неделю постепенно, не пытайся сразу закрыть весь план."
          uz: "Haftalik masalalar sonini asta-sekin oshir, darhol butun rejani bajarishga urinmay."
      mistakes:
        - ru: "Решать только один тип задач — мозг привыкает к шаблону и перестаёт по-настоящему тренироваться."
          uz: "Faqat bir xil turdagi masala yechish — miya shablonga o'rganib qoladi va haqiqiy mashq qilmay qo'yadi."
        - ru: "Сразу смотреть решение при первой трудности — без борьбы с задачей тренировки мышления не происходит."
          uz: "Birinchi qiyinchilikda darhol yechimga qarash — masala bilan kurashmasdan fikrlash mashqi bo'lmaydi."
        - ru: "Перемешивать так же словарь и определения — для них, наоборот, лучше работают блоки, а не чередование."
          uz: "Lug'at va ta'riflarni ham xuddi shunday aralashtirish — ular uchun, aksincha, bloklar aralashtirishdan ko'ra yaxshi ishlaydi."
      first_week_example:
        ru: "4 раза в неделю по 20 минут, чередуя логику/математику/кейсы; подсказку использовать только после честной попытки."
        uz: "Haftada 4 marta 20 daqiqa, mantiq/matematika/keyslarni almashtirib; yordamdan faqat halol urinishdan keyin foydalan."
    source:
      name: "Brunmair & Richter 2019"
      url: "https://pubmed.ncbi.nlm.nih.gov/31556629/"
    template_id: hard_tasks

  - id: reading_minutes
    sphere: mind
    title: { ru: "Чтение длинных текстов", uz: "Uzun matnlarni oʻqish" }
    difficulty: "Для новичков"
    for_whom: "Для тех, кто почти не читает книги или длинные статьи"
    outcome: "В конце — чтение длинных текстов становится обычной частью недели"
    metric: { key: reading_minutes_week, kind: timer, unit: "мин/нед", rounding: 5 }
    secondary: ["прочитанные книги или главы, шт."]
    targets: ["30 дней", "60 дней"]
    pace: >-
      60→150 / 150→300 мин/нед; прибавлять около 10 минут в день каждую
      неделю. Для учебных/информационных текстов бумага даёт небольшое
      преимущество перед экраном (Delgado 2018); для художественных книг
      разницы нет.
    week_skeleton: "6×10–40 минут в неделю"
    minimal_version: "1 страница"
    guide:
      steps:
        - ru: "Выбери одну книгу или длинную статью заранее — так не тратишь время сессии на выбор, что читать."
          uz: "Kitob yoki uzun maqolani oldindan tanla — shunda sessiya vaqtini nima o'qishni tanlashga sarflamaysan."
        - ru: "Читай в одном и том же месте и времени каждый день — так быстрее формируется привычка."
          uz: "Har kuni bir xil joy va vaqtda o'qi — shunda odat tezroq shakllanadi."
        - ru: "Начни с реального для тебя объёма (даже 10 минут) и прибавляй примерно по 10 минут в день каждую неделю."
          uz: "O'zing uchun real hajmdan (hatto 10 daqiqadan) boshla va har hafta kuniga taxminan 10 daqiqa qo'shib bor."
        - ru: "Откладывай телефон на время чтения — лента в соцсетях не считается чтением длинных текстов."
          uz: "O'qish vaqtida telefonni chetga qo'y — ijtimoiy tarmoq lentasi uzun matn o'qish hisoblanmaydi."
      mistakes:
        - ru: "Пытаться сразу читать по часу в день — быстро надоедает и бросается уже через несколько дней."
          uz: "Darhol kuniga bir soat o'qishga urinish — tezda zerikadi va bir necha kunda tashlab qo'yiladi."
        - ru: "Засчитывать короткие посты и ленту соцсетей как «чтение» — цель именно про длинные связные тексты."
          uz: "Qisqa postlar va ijtimoiy tarmoq lentasini 'o'qish' deb hisoblash — maqsad aynan uzun, bog'langan matnlar haqida."
        - ru: "Читать учебный текст только с экрана, когда есть выбор — для информационных текстов бумага работает чуть лучше, особенно при ограничении времени."
          uz: "Tanlov bo'lsa ham, o'quv matnini faqat ekrandan o'qish — axborot xarakteridagi matnlar uchun qog'oz biroz yaxshiroq ishlaydi, ayniqsa vaqt cheklangan bo'lsa."
      first_week_example:
        ru: "6 дней в неделю по 10–15 минут одной книги или статьи, без телефона рядом; к концу недели — немного больше времени."
        uz: "Haftada 6 kun, 10–15 daqiqa bitta kitob yoki maqola, yonida telefonsiz; hafta oxiriga biroz ko'proq vaqt."
    source:
      name: "Delgado 2018"
      url: "https://www.uv.es/lasalgon/papers/Delgado%202018%20dont%20throw%20away%20your%20printed%20books.pdf"
    template_id: reading_minutes
