# Каталог целей сферы «Знания» (PRD 1.0). Источник: docs/content/NEWLIFE_1_0_CONTENT.md
# (раздел «2. ЗНАНИЯ (общая эрудиция с интервальными повторениями)», строки ~185-230).
# Схема и загрузчик — app/newlife/goal_catalog.py.
# Сценарий сезона (день за днём) каждой цели — app/seasons_library/<id>.yaml.
#
# ВАЖНО (обновлено по docs/knowledge/NEWLIFE_KNOWLEDGE_BASE.md §04, п. "Главные
# исправления черновика" №2-3): движок карточек должен использовать FSRS-6
# (библиотека py-fsrs, MIT, без ИИ — это детерминированные формулы) как
# основной алгоритм, а самодельную лестницу 1→3→7→16→35 дней держать только
# как запасной вариант, если FSRS не успеваем реализовать. В FSRS "не
# вспомнил" снижает стабильность карточки, но не сбрасывает её в ноль (в
# запасной лестничной схеме — откат на 2 ступени, а не в начало). Целевая
# доля вспоминания (desired retention) по умолчанию 90%, лимит новых
# карточек в день по умолчанию 10 (можно 5 или 20). Сам движок карточек
# (расчёт интервалов, долг повторений, лимит новых карточек в день) НЕ
# реализован этим агентом и не входит в эту задачу — он отдельная фича F5.
# Здесь заведены только каталог цели (метрика/темп/источник) и простой
# season-шаблон-обёртка (как у любой другой простой цели), без фактической
# логики интервалов внутри. Когда появится движок карточек, он должен
# использовать этот template_id и писать прогресс в ту же метрику
# (cards_mastered_week / streak_no_debt_days).
sphere: knowledge
goals:
  - id: flashcards_mastered
    sphere: knowledge
    title: { ru: "Освоенные факты по теме", uz: "Mavzu boʻyicha oʻzlashtirilgan faktlar" }
    difficulty: "Для новичков"
    for_whom: "Для тех, кто хочет регулярно узнавать новое и правда запоминать это надолго"
    outcome: "В конце — растущий запас карточек, которые ты уверенно вспоминаешь спустя 3+ недели"
    metric: { key: cards_mastered_week, kind: counter, unit: "карточек/нед", rounding: 1 }
    secondary: ["точность повторений, %", "долг повторений"]
    targets: ["30 дней", "60 дней"]
    pace: >-
      5–10 новых карточек в день (по умолчанию 10, можно увеличить до 20 —
      часть будущего движка карточек на FSRS, PRD F5). Карточка считается
      усвоенной надолго, если её стабильность (по алгоритму) выросла до 21+
      дня — обычно за 30 дней это 40–80 из 150–250 изученных карточек.
      Перерыв между повторениями оптимален не как фиксированная доля:
      примерно 20–40% от срока хранения, если нужно помнить неделю, и
      примерно 5–10%, если нужно помнить год — с ростом срока доля падает,
      хотя сам перерыв в днях растёт (Cepeda et al., 2008). Если повторения
      занимают больше 60 минут в день или вызывают тревогу — снижай нагрузку.
    week_skeleton: "Ежедневно по 10–15 минут"
    minimal_version: "5 карточек"
    guide:
      steps:
        - ru: "Выбери одну тему (история, география, наука, экономика) и заводи по ней 5–10 новых карточек в день (по умолчанию 10) — вопрос с одной стороны, короткий ответ с другой."
          uz: "Bitta mavzu tanla (tarix, geografiya, fan, iqtisod) va shu mavzu bo'yicha kuniga 5–10 ta (odatda 10 ta) yangi kartochka tuzing — bir tomonida savol, ikkinchi tomonida qisqa javob."
        - ru: "Каждый день проходи все карточки, которые приложение показывает «на повторение сегодня» — это важнее, чем добавлять новые."
          uz: "Har kuni ilova 'bugun takrorlash' deb ko'rsatgan barcha kartochkalarni ko'rib chiqing — bu yangi qo'shishdan muhimroq."
        - ru: "Если честно вспомнил ответ — отмечай «вспомнил», если нет — «не вспомнил»; не обманывай себя, иначе карточка не закрепится."
          uz: "Javobni rostdan eslab qolgan bo'lsang — 'esladim' deb belgilang, bo'lmasa — 'eslamadim'; o'zingizni aldamang, aks holda kartochka yodda qolmaydi."
        - ru: "Делай 6 коротких сессий в неделю по 10–15 минут — лучше часто и понемногу, чем редко и подолгу."
          uz: "Haftada 6 marta 10–15 daqiqalik qisqa mashg'ulot qiling — kam-kam va tez-tez qilish kamdan-kam va uzoq qilishdan yaxshiroq."
        - ru: "Карточка считается усвоенной надолго, когда ты правильно вспомнил её при интервале 21+ день — именно такие карточки идут в счёт цели за неделю."
          uz: "Kartochka 21+ kunlik interval bilan to'g'ri eslab qolinganda chinakam o'zlashtirilgan hisoblanadi — maqsadga haftalik hisobda aynan shu kartochkalar kiradi."
      mistakes:
        - ru: "Добавлять слишком много новых карточек за один день (намного больше 10–20) — долг повторений быстро накапливается и отбивает желание продолжать."
          uz: "Bir kunda juda ko'p (10–20 tadan ancha ko'p) yangi kartochka qo'shish — takrorlash qarzi tez to'planadi va davom ettirish xohishini yo'qotadi."
        - ru: "Копить долг повторений несколько дней подряд — лучше пройти хотя бы старые карточки и отложить добавление новых."
          uz: "Bir necha kun ketma-ket takrorlash qarzini to'plash — yangi qo'shishni kechiktirib, hech bo'lmasa eski kartochkalarni ko'rib chiqgan ma'qul."
        - ru: "Отмечать «вспомнил», когда на самом деле подглядел или угадал — это обманывает алгоритм интервалов и мешает реальному запоминанию."
          uz: "Aslida ko'rib yoki taxmin qilib 'esladim' deb belgilash — bu intervallar algoritmini chalg'itadi va haqiqiy yodlashga xalaqit beradi."
      first_week_example:
        ru: "Каждый день — 10–15 минут: 5–10 новых карточек по выбранной теме утром в транспорте + все карточки «на повторение сегодня» вечером."
        uz: "Har kuni 10–15 daqiqa: ertalab transportda tanlangan mavzu bo'yicha 5–10 yangi kartochka + kechqurun 'bugun takrorlash' kartochkalari."
    source:
      name: "Cepeda et al. 2008, Spacing effects"
      url: "https://pubmed.ncbi.nlm.nih.gov/19076480/"
    template_id: flashcards_mastered

  - id: flashcards_streak
    sphere: knowledge
    title: { ru: "Ежедневное повторение без долгов", uz: "Har kuni qarzsiz takrorlash" }
    difficulty: "Для новичков"
    for_whom: "Для тех, кто копит долг повторений и хочет сделать это привычкой"
    outcome: "В конце — повторения на сегодня закрыты каждый день, без накопленного долга"
    metric: { key: streak_no_debt_days, kind: counter, unit: "дней подряд", rounding: 1 }
    secondary: ["минуты на повторения"]
    targets: ["60 дней", "90 дней"]
    pace: >-
      На формирование привычки уходит в среднем 66 дней (разброс 18–254 —
      верхняя граница экстраполирована, само исследование шло 84 дня); один
      пропуск не обрушивает привычку целиком, но частые пропуски снижают
      итоговую автоматичность (Lally et al. 2010). Прогресс честнее видеть
      как «23 из 30 дней без долга», а не как серию дней подряд — серия
      обнуляется от одного пропуска и этим отбивает желание продолжать.
    week_skeleton: "Ежедневно, хотя бы 1 карточка в день"
    minimal_version: "1 карточка"
    guide:
      steps:
        - ru: "Каждый вечер (или в удобное фиксированное время) открывай карточки и проходи все, что приложение показывает «на сегодня», не оставляя их на завтра."
          uz: "Har kuni kechqurun (yoki qulay doimiy vaqtda) kartochkalarni ochib, ilova 'bugun' deb ko'rsatgan barchasini ertaga qoldirmay ko'rib chiqing."
        - ru: "Если совсем нет времени — пройди хотя бы 1 карточку, но не пропускай день полностью: цель именно в днях подряд без долга."
          uz: "Vaqt umuman bo'lmasa ham — hech bo'lmasa 1 ta kartochkani ko'rib chiqing, kunni butunlay o'tkazib yubormang: maqsad aynan qarzsiz ketma-ket kunlar."
        - ru: "Привяжи повторение к уже существующей привычке (сразу после завтрака, в транспорте) — так проще не забыть."
          uz: "Takrorlashni allaqachon bor odatga bog'lang (nonushtadan keyin, transportda) — shunda unutmaslik osonroq."
        - ru: "Если пропустил день и долг всё же накопился — в первую очередь закрывай именно долг, а не новые карточки."
          uz: "Agar bir kunni o'tkazib yuborib qarz to'plangan bo'lsa — birinchi navbatda aynan qarzni, yangi kartochkalarni emas, yoping."
        - ru: "Не ругай себя за один пропущенный день — по исследованиям, одна осечка не разрушает привычку целиком, продолжай со следующего дня."
          uz: "Bir kunni o'tkazib yuborgani uchun o'zingizni ayblamang — tadqiqotlarga ko'ra, bir xatolik odatni butunlay buzmaydi, keyingi kundan davom eting."
      mistakes:
        - ru: "Откладывать повторение «на потом в этот же день» — к вечеру дел накапливается, и карточки легко забываются совсем."
          uz: "Takrorlashni 'bugun keyinroq' deb qo'yish — kechqurungacha ishlar to'planib, kartochkalar butunlay esdan chiqadi."
        - ru: "Пытаться сразу «отработать» долг за несколько пропущенных дней одним огромным повторением — это утомляет и отбивает желание продолжать серию."
          uz: "Bir necha o'tkazib yuborilgan kunning qarzini bir yo'la katta takrorlash bilan 'yopishga' urinish — bu charchatadi va seriyani davom ettirish xohishini yo'qotadi."
        - ru: "Бросать серию полностью после одного пропуска, думая «всё равно сбилось»  — лучше просто продолжить с сегодняшнего дня."
          uz: "Bir marta o'tkazib yuborgandan keyin 'baribir buzildi' deb seriyani butunlay tashlab qo'yish — bugungi kundan davom etish yaxshiroq."
      first_week_example:
        ru: "Каждый день, в одно и то же время (например вечером после ужина) — проходишь все карточки «на сегодня», минимум 1, если времени совсем нет."
        uz: "Har kuni bir xil vaqtda (masalan, kechki ovqatdan keyin) — 'bugun' kartochkalarining barchasini, vaqt umuman bo'lmasa kamida 1 tasini ko'rib chiqasiz."
    source:
      name: "Lally et al. 2010, habit formation (UCL)"
      url: "https://www.ucl.ac.uk/news/2009/aug/how-long-does-it-take-form-habit"
    template_id: flashcards_streak

  - id: online_course
    sphere: knowledge
    title: { ru: "Один учебный курс по интересу", uz: "Qiziqish boʻyicha bitta onlayn kurs" }
    difficulty: "Для новичков"
    for_whom: "Для тех, кто хочет наконец пройти курс (Coursera, edX, лекции), а не бросить на середине"
    outcome: "В конце — курс пройден от начала до конца, с пройденным тестом по каждому модулю"
    metric: { key: course_progress_pct, kind: percent, unit: "%", rounding: 1 }
    secondary: ["тест модуля, %"]
    targets: ["30 дней", "60 дней"]
    pace: >-
      Обычный курс занимает 4–8 недель при 2–4 часах в неделю, один курс
      одновременно — у большинства MOOC низкая доля завершения, и за 6 лет
      наблюдений она не улучшилась (Reich & Ruipérez-Valiente, 2019, Science).
      Важно: с 8 августа 2025 Coursera вместо бесплатного audit даёт только
      превью первого модуля — полный курс доступен через financial aid; у
      edX audit-режим по-прежнему бесплатен, но без зачётных заданий и
      сертификата.
    week_skeleton: "3 сессии по 30 минут в неделю"
    minimal_version: "1 видео 2 минуты"
    guide:
      steps:
        - ru: "Выбери один конкретный курс, который давно откладывал, и сразу отметь, сколько в нём модулей — это твоя шкала прогресса."
          uz: "Uzoqdan kechiktirib kelgan bitta aniq kursni tanla va darhol unda nechta modul borligini belgilang — bu sizning taraqqiyot shkalangiz."
        - ru: "Поставь в календаре 3 слота по 30 минут в неделю — курс, на который «найду время как-нибудь», обычно так и не проходится."
          uz: "Haftasiga 3 marta 30 daqiqalik vaqt oynasini kalendarga belgilang — 'qachondir vaqt topaman' deb qoldirilgan kurs odatda tugatilmaydi."
        - ru: "После каждого видео или главы проходи тест модуля, если он есть — это проверяет, что материал действительно усвоен, а не просто просмотрен."
          uz: "Har bir video yoki bob dan keyin, agar bo'lsa, modul testini topshiring — bu material haqiqatan o'zlashtirilganini, shunchaki ko'rilganini emas, tekshiradi."
        - ru: "Отмечай прогресс в процентах после каждой сессии — видеть «осталось 20%» мотивирует больше, чем «где-то в середине»."
          uz: "Har mashg'ulotdan keyin foizdagi taraqqiyotni belgilang — 'yana 20% qoldi' deb ko'rish 'qayerdadir o'rtada' deyishdan ko'ra ko'proq rag'batlantiradi."
        - ru: "Если тема оказалась слишком сложной или неинтересной на старте — лучше осознанно сменить курс один раз, чем годами не заканчивать прежний."
          uz: "Agar mavzu boshida juda qiyin yoki qiziqarsiz bo'lib chiqsa — avvalgisini yillab tugatmasdan yurishdan ko'ra, bir marta ongli ravishda kursni almashtirish yaxshiroq."
      mistakes:
        - ru: "Записываться на несколько курсов одновременно — внимание распыляется, и в итоге ни один не заканчивается."
          uz: "Bir vaqtda bir necha kursga yozilish — e'tibor tarqalib ketadi va natijada hech biri tugallanmaydi."
        - ru: "Смотреть видео «для галочки» без теста модуля — без проверки легко переоценить, что реально запомнилось."
          uz: "Modul testisiz 'shunchaki ko'rish uchun' video ko'rish — tekshirmasdan nima haqiqatan yodda qolganini oshirib baholash oson."
        - ru: "Бросать курс на середине из-за одной сложной темы — проще пропустить сложный модуль и вернуться к нему позже, чем останавливаться совсем."
          uz: "Bitta qiyin mavzu tufayli kursni o'rtada tashlab qo'yish — butunlay to'xtashdan ko'ra qiyin modulni o'tkazib yuborib, keyinroq qaytish osonroq."
      first_week_example:
        ru: "Пн/Ср/Пт по 30 минут: смотришь модуль курса и проходишь его тест, отмечаешь новый % прогресса после каждой сессии."
        uz: "Dush/Chor/Juma, 30 daqiqadan: kurs modulini ko'rib, testini topshirasiz, har mashg'ulotdan keyin yangi % taraqqiyotni belgilaysiz."
    source:
      name: "Reich & Ruipérez-Valiente, 2019, The MOOC Pivot (Science)"
      url: "https://tsl.mit.edu/research/the-mooc-pivot/"
    template_id: online_course

  - id: trivia_uzbekistan_world
    sphere: knowledge
    title: { ru: "Знать Узбекистан и мир", uz: "Oʻzbekiston va dunyoni bilish" }
    difficulty: "Для новичков"
    for_whom: "Для тех, кто хочет разбираться в истории, географии и устройстве мира вокруг себя"
    outcome: "В конце — заметно выше результат ежемесячного теста-викторины"
    metric: { key: quiz_accuracy_pct, kind: percent, unit: "%", rounding: 1 }
    secondary: ["число тем"]
    targets: ["30 дней", "60 дней"]
    pace: >-
      Цикл повторения тем — 4 недели: точность отложенной викторины (вопросы,
      изученные 7+ дней назад) растёт на +15–25 п.п. за 30 дней и держится
      ≥80% за 90 дней. Норма — 5 новых карточек в день из готовых колод плюс
      1 викторина в неделю на 10 вопросов [эвристика]. Отложенная проверка
      показывает именно удержание в памяти, а не узнавание сразу после
      изучения (Cepeda et al. 2008; Rowland 2014).
    week_skeleton: "4 сессии по 10 минут в неделю"
    minimal_version: "3 вопроса"
    guide:
      steps:
        - ru: "4 недели по кругу: нед. 1 — регионы и города Узбекистана, соседи и столицы Центральной Азии; нед. 2 — ключевые даты и личности истории Узбекистана и мира; нед. 3 — базовые экономические понятия (инфляция, ВВП, курс валют) на местных примерах; нед. 4 — 20 базовых фактов науки (клетка, энергия, климат)."
          uz: "4 hafta aylanma tartibda: 1-hafta — Oʻzbekiston viloyatlari va shaharlari, Markaziy Osiyo qoʻshnilari va poytaxtlari; 2-hafta — Oʻzbekiston va dunyo tarixining asosiy sanalari va shaxslari; 3-hafta — mahalliy misollardagi asosiy iqtisodiy tushunchalar (inflyatsiya, YaIM, valyuta kursi); 4-hafta — fanning 20 ta asosiy fakti (hujayra, energiya, iqlim)."
        - ru: "4 раза в неделю по 10 минут читай короткие факты или смотри короткое видео по теме текущей недели."
          uz: "Haftada 4 marta, 10 daqiqadan, joriy hafta mavzusi bo'yicha qisqa faktlarni o'qing yoki qisqa video ko'ring."
        - ru: "После каждой сессии задай себе 1–2 вопроса по тому, что узнал, не глядя в текст — это проверяет, запомнил ли ты, а не просто прочитал."
          uz: "Har mashg'ulotdan keyin matnga qaramay, o'qiganlaringiz bo'yicha o'zingizga 1–2 savol bering — bu shunchaki o'qiganini emas, eslab qolganini tekshiradi."
        - ru: "Раз в неделю (в субботу) проходи тест-викторину по темам, изученным 7+ дней назад, и смотри на точность в процентах — так понятнее, что реально осталось в памяти, а не что ты только что прочитал."
          uz: "Haftada bir marta (shanba kuni) 7+ kun oldin o'rganilgan mavzular bo'yicha test-viktorinani topshiring va foizdagi aniqlikka qarang — shunda hozirgina o'qiganingiz emas, haqiqatan yodda qolgani ko'rinadi."
        - ru: "Не смешивай очень похожие факты (например разные похожие даты или цифры) в одной неделе — это создаёт путаницу в памяти; темы со слабым результатом викторины повторяй чаще в следующем цикле."
          uz: "Bir-biriga juda o'xshash faktlarni (masalan, o'xshash sanalar yoki raqamlarni) bir haftada aralashtirmang — bu xotirada chalkashlik yaratadi; viktorinada natija past bo'lgan mavzularni keyingi siklda ko'proq takrorlang."
      mistakes:
        - ru: "Читать много фактов подряд без попытки вспомнить их позже — без повторения большая часть забывается за пару дней."
          uz: "Ko'plab faktlarni keyinroq eslashga urinmasdan ketma-ket o'qish — takrorlash bo'lmasa, ularning ko'pi bir necha kunda esdan chiqadi."
        - ru: "Проходить викторину сразу после прочтения темы вместо того, чтобы подождать 7+ дней — так ты проверяешь память прямо сейчас, а не реальное долгое удержание."
          uz: "Mavzuni o'qib bo'lgach darhol viktorinani topshirish, 7+ kun kutish o'rniga — shunda hozirgi xotirani tekshirasiz, uzoq muddatli saqlanishini emas."
        - ru: "Учить даты и цифры без контекста, вместо того чтобы привязывать их к истории или примеру — такие факты легче забываются и легче путаются с похожими."
          uz: "Sanalar va raqamlarni tarix yoki misolga bog'lamay, kontekstsiz yodlash — bunday faktlar tezroq unutiladi va o'xshashlari bilan oson chalkashadi."
      first_week_example:
        ru: "4 раза по 10 минут на неделе 1 — регионы и города Узбекистана, соседи по Центральной Азии: читаешь факты и задаёшь себе 1–2 вопроса после каждой сессии."
        uz: "4 marta 10 daqiqadan, 1-hafta — Oʻzbekiston viloyatlari va shaharlari, Markaziy Osiyo qoʻshnilari: faktlarni o'qiysiz va har mashg'ulotdan keyin o'zingizga 1–2 savol berasiz."
    source:
      name: "Cepeda et al. 2008 / Rowland 2014 — отложенная проверка измеряет удержание"
      url: "https://pubmed.ncbi.nlm.nih.gov/19076480/"
    template_id: trivia_uzbekistan_world

  - id: reading_notes
    sphere: knowledge
    title: { ru: "Конспект прочитанного", uz: "Oʻqilganlarni qisqa yozib borish" }
    difficulty: "Для новичков"
    for_whom: "Для тех, кто читает, но ничего не остаётся в памяти"
    outcome: "В конце — привычка своими словами записывать главные мысли после чтения"
    metric: { key: reading_notes_count, kind: counter, unit: "мыслей/мес", rounding: 1 }
    secondary: ["сколько мыслей превращено в карточки"]
    targets: ["30 дней", "60 дней"]
    pace: >-
      Пересказ своими словами (вспоминание по памяти) работает лучше, чем
      выделение текста маркером или конспектирование-пересказ — это одна из
      двух техник с высшей оценкой полезности в метаобзоре Dunlosky et al.
      (2013), наряду с самопроверкой. При регулярной практике за 30 дней
      обычно набирается 20–30 своими словами записанных мыслей и 300–450
      минут чтения (~1–2 книги); цифры — для ежедневной растущей практики
      10→20–25 минут, при 3 сессиях в неделю по 10–15 минут ориентируйся на
      меньшую часть этого диапазона.
    week_skeleton: "3 сессии по 10 минут в неделю"
    minimal_version: "1 мысль"
    guide:
      steps:
        - ru: "Сразу после чтения (не на следующий день) запиши своими словами 1–3 главные мысли — не цитату, а то, как ты это понял."
          uz: "O'qib bo'lgach darhol (ertasiga emas) 1–3 asosiy fikrni o'z so'zlaringiz bilan yozing — iqtibos emas, o'zingiz qanday tushunganingizni."
        - ru: "Делай это 3 раза в неделю по 10 минут — после любой книги, статьи или длинного видео, которое показалось важным."
          uz: "Buni haftada 3 marta, 10 daqiqadan bajaring — muhim ko'ringan har qanday kitob, maqola yoki uzun videodan keyin."
        - ru: "Задай себе вопрос «что из этого я расскажу другу через неделю?» — так проще выделить действительно главное, а не всё подряд."
          uz: "O'zingizga 'buni hafta o'tgach do'stimga qanday aytib beraman?' deb savol bering — shunda hamma narsani emas, chindan muhimini ajratish osonroq."
        - ru: "Самые полезные из записанных мыслей переноси в карточки для повторения — так они не просто записаны, а закрепляются надолго."
          uz: "Yozilgan fikrlarning eng foydalilarini takrorlash uchun kartochkalarga ko'chiring — shunda ular shunchaki yozilmay, uzoq muddat yodda qoladi."
        - ru: "Считай мысли, а не страницы — цель в том, чтобы в голове осталось что-то полезное, а не в объёме прочитанного."
          uz: "Sahifalarni emas, fikrlarni sanang — maqsad o'qilgan hajmda emas, boshda foydali narsa qolishida."
      mistakes:
        - ru: "Просто выделять текст маркером вместо пересказа своими словами — это создаёт ложное чувство, что материал усвоен."
          uz: "O'z so'zlari bilan qayta aytish o'rniga matnni shunchaki belgilab qo'yish — bu material o'zlashtirilgan degan yolg'on tuyg'u yaratadi."
        - ru: "Откладывать запись мысли «на после» — через час-два детали забываются, и записывать становится нечего."
          uz: "Fikrni yozishni 'keyinroq'ga qoldirish — bir-ikki soatdan keyin tafsilotlar esdan chiqib, yozadigan narsa qolmaydi."
        - ru: "Писать подробный пересказ всего текста вместо 1–3 главных мыслей — длинный конспект реже дочитывается и реже повторяется."
          uz: "1–3 asosiy fikr o'rniga butun matnning batafsil qayta bayonini yozish — uzun konspekt kamroq o'qib chiqiladi va kamroq takrorlanadi."
      first_week_example:
        ru: "После 3 сессий чтения за неделю — сразу по 1–3 мысли своими словами; самую полезную мысль из них переносишь в карточку."
        uz: "Haftadagi 3 o'qish mashg'ulotidan keyin — darhol 1–3 ta fikrni o'z so'zlaringiz bilan; ulardan eng foydalisini kartochkaga ko'chirasiz."
    source:
      name: "Dunlosky et al. 2013, Effective learning techniques (APS)"
      url: "https://psychologicalscience.org/?p=82014"
    template_id: reading_notes
