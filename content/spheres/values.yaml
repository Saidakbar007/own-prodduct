# Каталог целей сферы «Ценности и дух» (PRD 1.0). Источник:
# docs/content/NEWLIFE_1_0_CONTENT.md (раздел "3. ЦЕННОСТИ И ДУХ
# (благодарность, рефлексия, осознанность, ценности, религиозная практика по
# желанию)", строки ~403-445) — приоритет выше docs/specs/NEWLIFE_V8_SPEC.md §7.
# Схема и загрузчик — app/newlife/goal_catalog.py.
# Сценарий сезона (день за днём) каждой цели — app/seasons_library/<id>.yaml.
#
# Решение по неоднозначности: контент-документ описывает 6 шаблонов целей,
# шестой — «Своя практика (по желанию)» — это слот для религиозной/личной
# практики, которую человек САМ называет и задаёт себе частоту ("задаёт сам"
# во всех колонках таблицы). У него нет фиксированной метрики/темпа/недели,
# которые можно было бы зашить в этот статический каталог, и продукт явно
# выключает религиозную практику по умолчанию (§F «Безопасность»: «Выключена
# по умолчанию, контент нейтральный, данные приватные») — то есть это
# отдельная будущая фича (кнопка «Отслеживать» + пользовательский ввод имени
# и частоты практики), а не статическая запись каталога. Поэтому здесь —
# только 5 целей с фиксированными метриками; «своя практика» не реализована
# (см. отчёт агента).
sphere: values
goals:
  - id: gratitude_journal
    sphere: values
    title: { ru: "Дневник благодарности", uz: "Minnatdorlik kundaligi" }
    difficulty: "Для новичков"
    for_whom: "Для тех, кто редко останавливается заметить хорошее"
    outcome: "В конце — регулярные записи благодарности входят в привычку"
    metric: { key: gratitude_entries, kind: counter, unit: "записей/нед", rounding: 1 }
    secondary: ["число пунктов в записи"]
    targets: ["60 дней", "90 дней"]
    pace: >-
      10 недель при записи 1 раз в неделю (Emmons & McCullough 2003: в
      исходном исследовании записи делали раз в неделю — поэтому по умолчанию
      не навязываем ежедневные записи). Варианты цели — 1 / 3 / 7 записей в неделю.
    week_skeleton: "1–3 записи по 3–5 пунктов благодарности в неделю"
    minimal_version: "1 пункт"
    source:
      name: "Emmons & McCullough 2003"
      url: "https://stafforini.com/works/emmons-2003-counting-blessings-burdens/"
    template_id: gratitude_journal

  - id: gratitude_people
    sphere: values
    title: { ru: "Благодарность людям", uz: "Odamlarga minnatdorlik" }
    difficulty: "Для новичков"
    for_whom: "Для тех, кто хочет чаще благодарить людей вокруг конкретно, не формально"
    outcome: "В конце — конкретное «спасибо, что…» звучит почти каждый день"
    metric: { key: thank_you_specific, kind: counter, unit: "раз/нед", rounding: 1 }
    secondary: ["число благодарственных сообщений"]
    targets: ["30 дней", "60 дней"]
    pace: "4–6 недель (эвристика). Варианты цели — 3 / 5 / 7 раз в неделю."
    week_skeleton: "1 благодарственное сообщение в неделю + ежедневно вслух"
    minimal_version: "1 «спасибо, что…»"
    source:
      name: "эвристика"
    template_id: gratitude_people

  - id: weekly_reflection
    sphere: values
    title: { ru: "Рефлексия недели", uz: "Hafta tahlili" }
    difficulty: "Для новичков"
    for_whom: "Для тех, кто хочет осознанно подводить итоги, а не просто жить дальше"
    outcome: "В конце — еженедельный разбор по 5 вопросам входит в привычку"
    metric: { key: weekly_reviews, kind: counter, unit: "разборов", rounding: 1 }
    secondary: ["% недель без пропуска"]
    targets: ["30 дней", "60 дней", "90 дней"]
    pace: "Постоянная привычка (эвристика). Варианты цели — 4 / 8 / 12 разборов."
    week_skeleton: "Воскресенье, 10 минут: разбор по 5 вопросам-кнопкам"
    minimal_version: "Ответить на 1 вопрос"
    source:
      name: "эвристика"
    template_id: weekly_reflection

  - id: mindfulness
    sphere: values
    title: { ru: "Осознанность", uz: "Ongli idrok (mindfulness)" }
    difficulty: "Для новичков"
    for_whom: "Для тех, кто хочет меньше жить на автопилоте и спокойнее переживать стресс"
    outcome: "В конце — практика дыхания/осознанности входит в привычный день"
    metric: { key: mindfulness_minutes, kind: timer, unit: "мин", rounding: 1 }
    secondary: ["число дней с практикой"]
    targets: ["60 дней", "90 дней"]
    pace: >-
      8 недель: программы медитации умеренно снижают тревогу и депрессию
      (Goyal et al. 2014, JAMA Intern Med). Варианты цели — 5 / 10 / 20 минут
      в день. Если на практике становится хуже (паника, тяжёлые воспоминания) —
      остановить (§F).
    week_skeleton: "5 дней практики дыхания в неделю"
    minimal_version: "2 минуты дыхания"
    source:
      name: "Goyal et al. 2014"
      url: "https://pubmed.ncbi.nlm.nih.gov/24395196/"
    template_id: mindfulness

  - id: live_by_values
    sphere: values
    title: { ru: "Жить по ценностям", uz: "Qadriyatlarga mos yashash" }
    difficulty: "Для новичков"
    for_whom: "Для тех, кто хочет действовать в согласии со своими ценностями, а не на автомате"
    outcome: "В конце — действия под свои ценности выбираются осознанно, каждую неделю"
    metric: { key: values_actions, kind: counter, unit: "действий/нед", rounding: 1 }
    secondary: ["число затронутых ценностей"]
    targets: ["60 дней", "90 дней"]
    pace: >-
      6–8 недель (Cohen & Sherman 2014: самоаффирмация через ценности).
      Варианты цели — 3 / 5 / 7 действий в неделю.
    week_skeleton: "Пн: выбрать ценность недели (из своих 3), ежедневно отмечать действие"
    minimal_version: "Назвать 1 ценность утром"
    source:
      name: "Cohen & Sherman 2014"
      url: "https://labs.psych.ucsb.edu/sherman/david/node/323"
    template_id: live_by_values
