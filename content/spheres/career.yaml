# Каталог целей сферы «Карьера и навыки» (PRD 1.0). Источник:
# docs/content/NEWLIFE_1_0_CONTENT.md (раздел «3. КАРЬЕРА И НАВЫКИ»,
# строки ~231-280). Схема и загрузчик — app/newlife/goal_catalog.py.
# Сценарий сезона (день за днём) каждой цели — app/seasons_library/<id>.yaml.
sphere: career
goals:
  - id: foreign_language
    sphere: career
    title: { ru: "Иностранный язык (CEFR)", uz: "Chet tili (CEFR)" }
    difficulty: "Средний уровень"
    for_whom: "Для тех, кто учит язык без системы и хочет дойти до следующего уровня CEFR"
    outcome: "В конце — накоплены часы занятий языком, уровень подтверждён тестом или экзаменом"
    metric: { key: language_hours, kind: timer, unit: "ч", rounding: 0.5 }
    secondary: ["новые слова, вышедшие в долгое повторение", "минуты разговорной практики"]
    targets: ["60 дней", "90 дней"]
    pace: >-
      От нуля до уровня: A2 ≈180–200 ч, B1 ≈350–400 ч, B2 ≈500–600 ч,
      C1 ≈700–800 ч. Переход B1→B2, например, занимает около 150–200 ч —
      это примерно 6–9 месяцев при 5 часах в неделю (Cambridge English).
    week_skeleton: "5 занятий в неделю по 45–60 минут"
    minimal_version: "5 слов или 2 минуты аудио"
    guide:
      steps:
        - ru: "Поставь 5 слотов в неделю по 45–60 минут и закрепи их за конкретным временем дня — язык растёт от регулярности, а не от редких долгих сессий."
          uz: "Haftada 5 ta 45–60 daqiqalik vaqt belgilang va ularni kun ichida aniq vaqtga bog'lang — til tartibli mashg'ulotdan o'sadi, kamdan-kam uzoq mashg'ulotdan emas."
        - ru: "В каждой сессии сочетай разные навыки: немного грамматики/лексики, немного слушания, немного разговорной практики вслух."
          uz: "Har mashg'ulotda turli ko'nikmalarni aralashtiring: biroz grammatika/lug'at, biroz tinglash, biroz ovoz chiqarib gaplashish."
        - ru: "Отмечай каждую сессию таймером в приложении — именно накопленные часы, а не «ощущение прогресса», показывают, сколько осталось до следующего уровня."
          uz: "Har mashg'ulotni ilovadagi taymer bilan belgilang — keyingi darajagacha qancha qolganini aynan to'plangan soatlar ko'rsatadi, 'rivojlanish hissi' emas."
        - ru: "Раз в несколько недель делай пробный тест или разговор с носителем/преподавателем, чтобы проверить, что часы переходят в реальный уровень."
          uz: "Bir necha haftada bir marta sinov test yoki ona tilida so'zlashuvchi/o'qituvchi bilan suhbat qiling — soatlar haqiqiy darajaga aylanayotganini tekshirish uchun."
        - ru: "Когда накопишь нужное число часов для перехода — назначь дату официального теста или экзамена, а не откладывай подтверждение уровня."
          uz: "O'tish uchun kerakli soat miqdorini to'plaganingizda — darajani tasdiqlashni kechiktirmay, rasmiy test yoki imtihon sanasini belgilang."
      mistakes:
        - ru: "Учить язык только пассивно (смотреть видео без разбора) — часы идут, но активный словарь и разговорная речь почти не растут."
          uz: "Tilni faqat passiv o'rganish (tahlilsiz video ko'rish) — soatlar o'tadi, lekin faol lug'at va nutq deyarli o'smaydi."
        - ru: "Заниматься редко, но очень долго (раз в неделю по 4 часа) — память работает лучше с частыми короткими сессиями, а не с одной марафонской."
          uz: "Kamdan-kam, lekin juda uzoq mashg'ulot (haftada bir marta 4 soat) — xotira tez-tez qisqa mashg'ulotlarda yaxshi ishlaydi, bitta marafon mashg'ulotda emas."
        - ru: "Бесконечно готовиться без даты экзамена — без назначенного срока подготовка легко растягивается на годы."
          uz: "Imtihon sanasini belgilamay cheksiz tayyorlanish — muddat belgilanmasa, tayyorgarlik yillarga cho'zilib ketishi oson."
      first_week_example:
        ru: "Пн/Вт/Ср/Чт/Пт по 45–60 минут: 20 минут грамматика/лексика, 20 минут аудио или видео на языке, 10–15 минут — проговорить вслух то, что выучил."
        uz: "Dush/Sesh/Chor/Pay/Juma 45–60 daqiqa: 20 daqiqa grammatika/lug'at, 20 daqiqa tilda audio yoki video, 10–15 daqiqa — o'rganganini ovoz chiqarib aytish."
    source:
      name: "Cambridge English, Guided learning hours"
      url: "https://support.cambridgeenglish.org/hc/en-gb/articles/202838506-Guided-learning-hours"
    template_id: foreign_language

  - id: vocabulary
    sphere: career
    title: { ru: "Словарь языка", uz: "Til lugʻati" }
    difficulty: "Для новичков"
    for_whom: "Для тех, кто хочет системно расширять словарный запас языка"
    outcome: "В конце — заметно больше слов усвоено надолго, а не просто выучено списком"
    metric: { key: words_mastered, kind: counter, unit: "слов", rounding: 10 }
    secondary: ["точность, %"]
    targets: ["30 дней", "60 дней"]
    pace: >-
      Для свободного чтения нужно порядка 8–9 тыс. семей слов (Nation,
      2006). Реалистичный темп — 10–20 новых слов в день, усвоенными
      считаются слова, вспомненные верно при интервале 21+ день.
    week_skeleton: "Ежедневно, 15 минут"
    minimal_version: "3 слова"
    guide:
      steps:
        - ru: "Каждый день добавляй 10–20 новых слов в карточки — удобно брать слова из того, что ты уже читаешь или слушаешь, а не из случайного списка."
          uz: "Har kuni 10–20 ta yangi so'z kartochkaga qo'shing — tasodifiy ro'yxatdan emas, o'qiyotgan yoki eshitayotgan matndan so'z olish qulayroq."
        - ru: "Повторяй старые карточки по растущим интервалам (например через 1, 3, 7, 16, 35 дней) — так слово закрепляется в долгой памяти, а не забывается сразу."
          uz: "Eski kartochkalarni o'sib boruvchi oraliqlarda (masalan, 1, 3, 7, 16, 35 kundan keyin) takrorlang — shunda so'z darhol unutilmay, uzoq xotirada mustahkamlanadi."
        - ru: "Слово считается усвоенным, только когда ты верно вспомнил его через 21+ день — поэтому не торопись удалять карточку после одного удачного ответа."
          uz: "So'z faqat 21+ kundan keyin to'g'ri eslanganda o'rganilgan hisoblanadi — shuning uchun bir marta to'g'ri javobdan keyin kartochkani o'chirishga shoshilmang."
        - ru: "Выделяй на повторение и новые слова 15 минут в день — короткая ежедневная сессия работает лучше, чем редкая долгая."
          uz: "Takrorlash va yangi so'zlarga kuniga 15 daqiqa ajrating — qisqa kunlik mashg'ulot kamdan-kam uzoq mashg'ulotdan yaxshiroq ishlaydi."
        - ru: "Раз в 1–2 недели проверяй точность по карточкам — если она падает, снижай число новых слов и больше времени отдавай повторению."
          uz: "Har 1–2 haftada kartochkalar bo'yicha aniqlikni tekshiring — u tushsa, yangi so'zlar sonini kamaytirib, ko'proq vaqtni takrorlashga bering."
      mistakes:
        - ru: "Учить слова списком без повторения — без системы интервалов большая часть слов забывается за несколько дней."
          uz: "So'zlarni ro'yxat qilib, takrorlamay o'rganish — intervallar tizimisiz so'zlarning katta qismi bir necha kunda unutiladi."
        - ru: "Добавлять слишком много новых слов за раз — повторений накапливается больше, чем реально успеваешь делать, и карточки забрасываются."
          uz: "Bir vaqtda juda ko'p yangi so'z qo'shish — takrorlash soni real bajarib bo'lmas darajada ko'payadi va kartochkalar tashlab qo'yiladi."
        - ru: "Считать слово выученным после одного правильного ответа — настоящая проверка усвоения — это память спустя 21+ день."
          uz: "So'zni bir marta to'g'ri javobdan keyin o'rganilgan deb hisoblash — haqiqiy tekshiruv 21+ kundan keyingi xotira."
      first_week_example:
        ru: "Каждый день — 10–15 новых слов в карточки (из того, что читаешь/слушаешь) + повторение карточек, которым пора по расписанию, всего 15 минут."
        uz: "Har kuni — kartochkaga 10–15 yangi so'z (o'qiyotgan/eshitayotganidan) + muddati yetgan kartochkalarni takrorlash, jami 15 daqiqa."
    source:
      name: "Nation, vocabulary coverage"
      url: "https://scholarspace.manoa.hawaii.edu/server/api/core/bitstreams/58770f7a-58e5-4558-a819-f059f6cb710b/content"
    template_id: vocabulary

  - id: programming
    sphere: career
    title: { ru: "Программирование (Python или веб)", uz: "Dasturlash (Python yoki veb)" }
    difficulty: "Для новичков"
    for_whom: "Для тех, кто хочет системно набрать часы практики с кодом"
    outcome: "В конце — заметно больше часов практики, решённых задач и коммитов на GitHub"
    metric: { key: coding_hours, kind: timer, unit: "ч", rounding: 0.5 }
    secondary: ["решённые задачи", "коммиты на GitHub"]
    targets: ["30 дней", "60 дней", "90 дней"]
    pace: >-
      Сертификация freeCodeCamp рассчитана примерно на 300 часов. При
      6–8 часах в неделю это около 9–12 месяцев — сезон покрывает часть
      этого пути.
    week_skeleton: "5 занятий в неделю по 60 минут"
    minimal_version: "Написать или поправить 1 строку кода"
    guide:
      steps:
        - ru: "Выбери одно направление (Python или веб) и один учебный трек (например freeCodeCamp) — не распыляйся на несколько курсов сразу."
          uz: "Bitta yo'nalish (Python yoki veb) va bitta o'quv yo'lini (masalan, freeCodeCamp) tanlang — bir vaqtda bir necha kursga tarqalmang."
        - ru: "Ставь 5 блоков по 60 минут в неделю и в каждом блоке пиши код сам, а не только смотри видео."
          uz: "Haftada 5 ta 60 daqiqalik blok belgilang va har blokda faqat video ko'rmay, o'zingiz kod yozing."
        - ru: "После каждого раздела теории сразу решай практическую задачу — теория без практики почти не превращается в навык."
          uz: "Har bir nazariy bo'limdan keyin darhol amaliy masala yeching — amaliyotsiz nazariya ko'nikmaga deyarli aylanmaydi."
        - ru: "Делай хотя бы 1 коммит в день в свой репозиторий на GitHub — даже маленькая правка — это видимый след прогресса."
          uz: "Kuniga kamida 1 marta GitHub repozitoriyangizga commit qiling — kichik tuzatish ham ko'rinadigan rivojlanish izi."
        - ru: "Раз в неделю считай накопленные часы и решённые задачи — это и есть твоя метрика, а не субъективное «вроде продвинулся»."
          uz: "Haftada bir marta to'plangan soat va yechilgan masalalarni sanang — bu aynan sizning ko'rsatkichingiz, 'go'yo oldinga ketdim' degan subyektiv tuyg'u emas."
      mistakes:
        - ru: "Смотреть туториалы без практики — часы накапливаются, но реальных навыков и своего кода почти не остаётся."
          uz: "Amaliyotsiz tutoriallar ko'rish — soatlar to'planadi, lekin haqiqiy ko'nikma va o'z kodingiz deyarli qolmaydi."
        - ru: "Перескакивать с одного курса на другой при первой трудности — непрерывность важнее новизны материала."
          uz: "Birinchi qiyinchilikda bir kursdan ikkinchisiga sakrash — materialning yangiligidan ko'ra uzluksizlik muhimroq."
        - ru: "Копировать готовые решения без попытки сначала написать своё — так задача решается один раз, а навык не остаётся."
          uz: "Avval o'zi yozishga urinmasdan tayyor yechimlarni ko'chirish — masala bir marta hal bo'ladi, ko'nikma qolmaydi."
      first_week_example:
        ru: "Пн–Пт по 60 минут: 20 минут теория/урок курса, 30 минут практическая задача, 10 минут — закоммитить изменения на GitHub."
        uz: "Dush–Juma 60 daqiqa: 20 daqiqa kurs nazariyasi/darsi, 30 daqiqa amaliy masala, 10 daqiqa — GitHubga o'zgarishlarni commit qilish."
    source:
      name: "freeCodeCamp certifications"
      url: "https://www.freecodecamp.org/news/freecodecamp-certifications/"
    template_id: programming

  - id: portfolio
    sphere: career
    title: { ru: "Портфолио", uz: "Portfolio" }
    difficulty: "Для новичков"
    for_whom: "Для тех, кто начинает и бросает проекты на середине"
    outcome: "В конце — хотя бы один законченный проект с публичной ссылкой и описанием"
    metric: { key: completed_projects, kind: counter, unit: "проектов", rounding: 1 }
    secondary: ["проекты с описанием README"]
    targets: ["30 дней", "60 дней"]
    pace: "Небольшой проект занимает 2–4 недели (без отдельного источника — обычная практика)"
    week_skeleton: "3 сессии в неделю по 60 минут"
    minimal_version: "1 коммит или 1 строка описания"
    guide:
      steps:
        - ru: "Выбери проект размером на 2–4 недели — сначала маленький и завершённый лучше, чем большой и брошенный на середине."
          uz: "2–4 haftaga mo'ljallangan loyiha tanlang — avval kichik va yakunlangan loyiha, katta va yarim yo'lda tashlab qo'yilgandan yaxshiroq."
        - ru: "Сразу заведи публичный репозиторий (GitHub) или страницу (Behance) и выложи туда первую версию, даже сырую."
          uz: "Darhol ochiq repozitoriya (GitHub) yoki sahifa (Behance) oching va birinchi, hom bo'lsa ham, versiyani joylashtiring."
        - ru: "Работай по 3 сессии в неделю по 60 минут, двигаясь маленькими кусками — не жди «вдохновения» на весь проект сразу."
          uz: "Haftada 3 marta 60 daqiqalik seanslarda, kichik qismlarga bo'lib ishlang — butun loyiha uchun 'ilhom'ni kutib o'tirmang."
        - ru: "Как только проект работает хотя бы в минимальном виде — опубликуй ссылку и напиши короткое README, что это и как запустить."
          uz: "Loyiha hech bo'lmasa minimal holda ishlasa — havolani e'lon qiling va qisqa README yozing: bu nima va qanday ishga tushiriladi."
        - ru: "Если проект становится слишком большим — урежь его до минимальной версии, которую реально закончить, а не бросай совсем."
          uz: "Loyiha juda kattalashib ketsa — uni haqiqatan tugatish mumkin bo'lgan minimal versiyaga qisqartiring, lekin butunlay tashlab qo'ymang."
      mistakes:
        - ru: "Бросать проект на середине из-за новой идеи или скуки — лучше сократить текущий до минимума и опубликовать, чем начинать третий незакрытый."
          uz: "Yangi g'oya yoki zerikish tufayli loyihani yarim yo'lda tashlab qo'yish — joriy loyihani minimal darajaga qisqartirib e'lon qilish uchinchi tugallanmagan loyihani boshlashdan yaxshiroq."
        - ru: "Делать проект идеальным «для себя» и не выкладывать публично — без публичной ссылки проект не считается законченным для портфолио."
          uz: "Loyihani 'o'zim uchun' mukammal qilib, ochiq joylashtirmaslik — ochiq havolasiz loyiha portfolio uchun tugallangan hisoblanmaydi."
        - ru: "Откладывать README и описание на «потом» — без объяснения, что делает проект, его сложно оценить тому, кто видит впервые."
          uz: "README va tavsifni 'keyinroq'ga qoldirish — loyiha nima qilishini tushuntirmasa, uni birinchi marta ko'rgan odam baholashi qiyin."
      first_week_example:
        ru: "Пн — выбрать маленький проект и завести репозиторий, Ср — сделать рабочую, пусть и грубую версию, Пт — написать README и опубликовать ссылку."
        uz: "Dush — kichik loyiha tanlash va repozitoriya ochish, Chor — ishlaydigan, qo'pol bo'lsa ham, versiya qilish, Juma — README yozish va havolani e'lon qilish."
    source:
      name: "эвристика"
    template_id: portfolio

  - id: certificate
    sphere: career
    title: { ru: "Сертификат (IELTS, CEFR, Google, Coursera, freeCodeCamp)", uz: "Sertifikat (IELTS, CEFR, Google, Coursera, freeCodeCamp)" }
    difficulty: "Средний уровень"
    for_whom: "Для тех, кто готовится к экзамену или сертификации, но тянет и не назначает дату"
    outcome: "В конце — назначенный экзамен сдан, финал засчитывается только кнопкой «сдал»"
    metric: { key: exam_prep_pct, kind: percent, unit: "%", rounding: 1 }
    secondary: ["результат пробного теста"]
    targets: ["30 дней", "60 дней"]
    pace: >-
      Срок подготовки считается от набранных часов по языку или по курсу
      (без отдельного источника — производная от целей «Язык» и «Курс»).
    week_skeleton: "4 сессии в неделю по 60 минут"
    minimal_version: "1 вопрос пробника"
    guide:
      steps:
        - ru: "Сразу выбери конкретный экзамен и назначь дату — без даты подготовка легко растягивается на неопределённый срок."
          uz: "Darhol aniq imtihonni tanlang va sanasini belgilang — sana bo'lmasa, tayyorgarlik noma'lum muddatga cho'zilib ketishi oson."
        - ru: "Разбей программу подготовки на блоки по неделям — каждую неделю закрывай понятную долю плана, а не «готовлюсь вообще»."
          uz: "Tayyorgarlik dasturini haftalik bloklarga bo'ling — har hafta rejaning aniq qismini yopib boring, 'umuman tayyorlanish' emas."
        - ru: "4 раза в неделю по 60 минут разбирай формат экзамена: типы заданий, тайминг, критерии оценки."
          uz: "Haftada 4 marta 60 daqiqa imtihon formatini o'rganing: topshiriq turlari, vaqt chegarasi, baholash mezonlari."
        - ru: "Регулярно решай пробные тесты в условиях, близких к реальному экзамену (время, без подсказок) — это главный способ проверить готовность."
          uz: "Haqiqiy imtihonga yaqin shartlarda (vaqt chegarasi, yordamisiz) muntazam sinov testlarini yeching — bu tayyorgarlikni tekshirishning asosiy usuli."
        - ru: "Когда процент пройденной подготовки и результат пробника стабильно высокие — иди на экзамен и отметь в приложении «сдал»."
          uz: "Tayyorgarlik foizi va sinov natijasi barqaror yuqori bo'lganda — imtihonga boring va ilovada 'topshirdim' deb belgilang."
      mistakes:
        - ru: "Готовиться без назначенной даты экзамена — бесконечная подготовка без срока почти никогда не заканчивается сдачей."
          uz: "Imtihon sanasini belgilamay tayyorlanish — muddatsiz cheksiz tayyorgarlik deyarli hech qachon topshirish bilan tugamaydi."
        - ru: "Решать только теорию и не трогать пробные тесты — реальный экзамен проверяет скорость и формат, а не только знание материала."
          uz: "Faqat nazariyani o'rganib, sinov testlarga qo'l urmaslik — haqiqiy imtihon tezlik va formatni ham tekshiradi, nafaqat materialni bilishni."
        - ru: "Переносить дату экзамена при первой неуверенности — лучше сдать с текущим результатом, чем откладывать бесконечно."
          uz: "Birinchi ishonchsizlikda imtihon sanasini ko'chirish — joriy natija bilan topshirish cheksiz kechiktirishdan yaxshiroq."
      first_week_example:
        ru: "Пн — назначить дату экзамена и записать план по неделям, Вт/Чт — разбор формата заданий, Сб — пробный тест по таймеру."
        uz: "Dush — imtihon sanasini belgilash va haftalik reja yozish, Sesh/Pay — topshiriq formatini o'rganish, Shan — taymer bilan sinov test."
    source:
      name: "эвристика"
