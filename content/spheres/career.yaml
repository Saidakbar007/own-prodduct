  - id: resume_applications
    sphere: career
    title: { ru: "Резюме и стажировки", uz: "Rezyume va amaliyotlar" }
    difficulty: "Для новичков"
    for_whom: "Для тех, кто годами «обновит резюме на днях», но не отправляет заявки"
    outcome: "В конце — регулярный поток отправленных заявок и обновлённое резюме/LinkedIn"
    metric: { key: applications_sent, kind: counter, unit: "заявок/мес", rounding: 1 }
    secondary: ["ответы и собеседования"]
    targets: ["30 дней", "60 дней"]
    pace: "Без отдельного источника — темп задаётся самим пользователем"
    week_skeleton: "2 сессии в неделю по 30 минут"
    minimal_version: "Сохранить 1 вакансию"
    guide:
      steps:
        - ru: "Сначала обнови резюме и профиль LinkedIn/аналог одной версией «на сейчас» — не жди, пока резюме станет идеальным."
          uz: "Avval rezyume va LinkedIn/shunga o'xshash profilni 'hozirgi' bir versiya qilib yangilang — rezyume mukammal bo'lishini kutmang."
        - ru: "Два раза в неделю по 30 минут — находи и сохраняй вакансии, которые подходят по направлению и уровню."
          uz: "Haftada 2 marta 30 daqiqa — yo'nalish va darajaga mos vakansiyalarni topib saqlang."
        - ru: "Перед отправкой каждой заявки чуть подправляй резюме или сопроводительное письмо под конкретную вакансию — это повышает отклик."
          uz: "Har bir arizani yuborishdan oldin rezyume yoki xatni aynan shu vakansiyaga moslab biroz tuzating — bu javob olish ehtimolini oshiradi."
        - ru: "Отправляй заявки регулярно — 2–5 в начале, затем 5–10 в месяц — важнее стабильный поток, чем один «идеальный» день отправки."
          uz: "Arizalarni muntazam yuboring — boshida 2–5, keyin oyiga 5–10 — bir 'mukammal' yuborish kuni emas, barqaror oqim muhimroq."
        - ru: "Записывай ответы и собеседования отдельно — это покажет, где слабое место: мало заявок или низкий отклик на них."
          uz: "Javoblar va suhbatlarni alohida yozib boring — bu qayerda zaif joy borligini ko'rsatadi: arizalar kamligi yoki ularga javob kamligi."
      mistakes:
        - ru: "Откладывать отправку заявок до «идеального» резюме — рабочая версия, отправленная сегодня, лучше идеальной, отправленной через месяц."
          uz: "Arizalarni 'mukammal' rezyumegacha kechiktirish — bugun yuborilgan ishlaydigan versiya, bir oydan keyin yuboriladigan mukammalidan yaxshiroq."
        - ru: "Отправлять одно и то же резюме без изменений во все вакансии подряд — отклик заметно ниже, чем у чуть адаптированных заявок."
          uz: "Bir xil rezyumeni o'zgartirmasdan barcha vakansiyalarga ketma-ket yuborish — biroz moslashtirilgan arizalarga nisbatan javob sezilarli kamroq."
        - ru: "Бросать поток заявок после первых отказов — отказы на старте — это нормальная часть процесса, а не сигнал остановиться."
          uz: "Birinchi rad javoblaridan keyin ariza yuborishni to'xtatish — boshida rad javoblar jarayonning normal qismi, to'xtash signali emas."
      first_week_example:
        ru: "Пн — обновить резюме и LinkedIn, Ср/Сб по 30 минут — найти и сохранить вакансии, отправить 2–3 заявки с коротким сопроводительным письмом."
        uz: "Dush — rezyume va LinkedIn-ni yangilash, Chor/Shan 30 daqiqadan — vakansiyalarni topib saqlash, qisqa xat bilan 2–3 ariza yuborish."
    source:
      name: "эвристика"
    template_id: resume_applications
