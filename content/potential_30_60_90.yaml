# Текст экрана "Потенциал 30/60/90" после Точки А (NEWLIFE_2_0.md §2.1 п.8).
# Цифры — буквально из docs/knowledge/NEWLIFE_KNOWLEDGE_BASE.md §3 "Карточки
# протоколов" (Тело/Разум/Энергия). Только 3 сферы к презентации 2026-11-09.
#
# Ключи "30"/"60"/"90" — это дни, на которые протокол даёт явный числовой
# результат в строке "Результат:". Если протокол не называет цифру на какой-то
# из этих дней — ключ пропущен (не выдуман). Где протокол говорит про 63 дня
# (run_5k, Couch to 5K — 9 недель), число отнесено к ключу "60", так как это
# ближе к финалу 9-недельной программы и совпадает с targets цели в
# content/spheres/body.yaml ("60 дней"/"90 дней"). Цели без чёткого
# протокольного результата (water, sitting_breaks из body.yaml) в файл не
# включены — см. отчёт автора в чате.
goals:
  # --- Тело (content/spheres/body.yaml) ---
  muscle_gain:
    "30": { ru: "+0,4–1 кг массы тела при росте силовых", uz: "Kuch oshgani sari tana vazni +0,4–1 kg" }
    "90": { ru: "+1,5–3 кг, заметен рост объёмов рук и бёдер", uz: "+1,5–3 kg, qo'l va son hajmi sezilarli oshadi" }

  fat_loss_safe:
    "30": { ru: "−1,5–3 кг веса (при старте 60–80 кг)", uz: "Vazn −1,5–3 kg (60–80 kg boshlang'ich vaznda)" }
    "90": { ru: "−4–8 кг веса", uz: "Vazn −4–8 kg" }

  run_5k:
    "30": { ru: "5 минут бега без остановки", uz: "5 daqiqa to'xtamay yugurish" }
    "60": { ru: "30 минут бега без остановки, около 5 км", uz: "30 daqiqa to'xtamay yugurish, taxminan 5 km" }

  pullups_10:
    "30": { ru: "3 подхода по 5 негативных повторений", uz: "5 tadan negativ takrorning 3 ta yondashuvi" }
    "90": { ru: "1–3 чистых подтягивания подряд", uz: "Ketma-ket 1–3 toza tortilish" }

  pushups_50:
    "30": { ru: "+5–10 отжиманий или на ступень выше в лестнице", uz: "+5–10 ta push-up yoki lestnikada bir bosqich yuqori" }
    "90": { ru: "20 отжиманий подряд", uz: "Ketma-ket 20 ta push-up" }

  activity_steps:
    "30": { ru: "+2000–3000 шагов в день к стартовому уровню", uz: "Boshlang'ich darajaga +2000–3000 qadam/kun" }
    "90": { ru: "8–10 тысяч шагов в день", uz: "Kuniga 8–10 ming qadam" }

  sleep_consistency:
    "30": { ru: "Сон ближе к 7 часам в среднем за ночь", uz: "Tungi uyqu o'rtacha 7 soatga yaqinlashadi" }
    "90": { ru: "7+ часов сна в 5 из 7 ночей", uz: "7 kundan 5 kechada 7+ soat uyqu" }

  flexibility:
    "30": { ru: "+3–5 см в тесте «наклон сидя»", uz: "'O'tirib egilish' testida +3–5 sm" }
    "90": { ru: "+5–10 см в тесте «наклон сидя»", uz: "'O'tirib egilish' testida +5–10 sm" }

  nutrition:
    "30": { ru: "≥5 порций овощей и фруктов в 5 из 7 дней", uz: "7 kundan 5 kunida ≥5 porsiya sabzavot-meva" }
    "90": { ru: "Стабильно 5 порций в день, белок в каждом приёме", uz: "Har kuni barqaror 5 porsiya, har ovqatda oqsil" }

  # --- Разум (content/spheres/mind.yaml) ---
  deep_focus:
    "30": { ru: "300 минут фокуса в неделю, 70%+ блоков без прерываний", uz: "Haftada 300 daqiqa diqqat, bloklarning 70%+i uzilishsiz" }
    "90": { ru: "300–500 минут в неделю, блоки по 50 минут", uz: "Haftada 300–500 daqiqa, 50 daqiqalik bloklar" }

  self_check_study:
    "30": { ru: "Самопроверка в 70%+ учебных сессий вместо перечитывания", uz: "O'z-o'zini tekshirish sessiyalarning 70%+ida, qayta o'qish o'rniga" }

  memory_retention:
    "30": { ru: "Точность вспоминания через 7 дней — от 60%", uz: "7 kundan keyin eslab qolish aniqligi — 60%dan" }
    "90": { ru: "Точность вспоминания через 7 дней — 75–85%", uz: "7 kundan keyin eslab qolish aniqligi — 75–85%" }

  hard_tasks:
    "30": { ru: "15–20 сложных задач в неделю", uz: "Haftada 15–20 ta qiyin masala" }
    "90": { ru: "30 задач в неделю", uz: "Haftada 30 ta masala" }

  reading_minutes:
    "30": { ru: "150–200 минут чтения в неделю", uz: "Haftada 150–200 daqiqa o'qish" }
    "90": { ru: "300 минут в неделю, 1–2 книги или учебник прочитаны", uz: "Haftada 300 daqiqa, 1–2 kitob yoki darslik o'qilgan" }

  # --- Энергия (content/spheres/energy.yaml) ---
  stress_relief_practice:
    "30": { ru: "Освоены 5 навыков ВОЗ, есть «свой» навык на 30 секунд", uz: "JSST ning 5 ko'nikmasi o'zlashtirilgan, 30 soniyalik 'o'z' usul bor" }
    "90": { ru: "Ежедневная практика 5–10 минут, стресс в чек-ине реже", uz: "Har kuni 5–10 daqiqa mashq, stress chek-inda kamroq" }

  breathing_practice:
    "30": { ru: "5 минут практики в 5+ дней в неделю", uz: "Haftada 5+ kunda 5 daqiqalik mashq" }
    "90": { ru: "Навык включается за 1 минуту в стрессовой ситуации", uz: "Ko'nikma stressli vaziyatda 1 daqiqada ishga tushadi" }

  nature_time:
    "30": { ru: "120+ минут на природе в неделю, 3 из 4 недель", uz: "Haftada 120+ daqiqa tabiatda, 4 haftadan 3 tasida" }
    "90": { ru: "Стабильно 120–200 минут на природе в неделю", uz: "Barqaror haftada 120–200 daqiqa tabiatda" }

  screen_off_before_sleep:
    "30": { ru: "30+ минут без телефона перед сном, 5+ вечеров в неделю", uz: "Uyquga 30+ daqiqa qolganda ekransiz, haftada 5+ kecha" }
    "90": { ru: "45–60 минут без экрана, телефон заряжается не у кровати", uz: "45–60 daqiqa ekransiz, telefon to'shak yonida emas quvvatlanadi" }

  stable_wake_time:
    "30": { ru: "Разброс подъёма ≤60 минут", uz: "Turish vaqti tarqoqligi ≤60 daqiqa" }
    "90": { ru: "Разброс подъёма ≤30 минут, сон 7+ часов в 5 из 7 ночей", uz: "Turish vaqti tarqoqligi ≤30 daqiqa, 7 kundan 5 kechada 7+ soat uyqu" }
