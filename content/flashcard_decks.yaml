knowledge_trivia:
  title: { ru: "Набор «Знания»", uz: "«Bilim» to'plami" }
  cards:
    - id: trivia_001
      front: { ru: "Самая длинная река в мире?", uz: "Dunyodagi eng uzun daryo?" }
      back:
        ru: "Нил (по одной из методик измерения — Амазонка) — около 6650 км."
        uz: "Nil (ba'zi o'lchash usullariga ko'ra — Amazonka) — taxminan 6650 km."
    - id: trivia_002
      front: { ru: "Самый большой океан на Земле?", uz: "Yer sharidagi eng katta okean?" }
      back:
        ru: "Тихий океан."
        uz: "Tinch okeani."
    - id: trivia_003
      front: { ru: "Самая высокая гора в мире?", uz: "Dunyodagi eng baland tog'?" }
      back:
        ru: "Эверест (Джомолунгма), около 8849 метров."
        uz: "Everest (Jomolungma), taxminan 8849 metr."
    - id: trivia_004
      front: { ru: "Столица Франции?", uz: "Fransiyaning poytaxti?" }
      back:
        ru: "Париж."
        uz: "Parij."
    - id: trivia_005
      front: { ru: "Сколько планет в Солнечной системе?", uz: "Quyosh sistemasida nechta sayyora bor?" }
      back:
        ru: "Восемь."
        uz: "Sakkizta."
    - id: trivia_006
      front: { ru: "Самая большая планета Солнечной системы?", uz: "Quyosh sistemasidagi eng katta sayyora?" }
      back:
        ru: "Юпитер."
        uz: "Yupiter."
    - id: trivia_007
      front: { ru: "Какой газ растения выделяют в процессе фотосинтеза?", uz: "O'simliklar fotosintez jarayonida qaysi gazni ajratadi?" }
      back:
        ru: "Кислород."
        uz: "Kislorod."
    - id: trivia_008
      front: { ru: "Какой химический элемент обозначается символом «O»?", uz: "«O» belgisi qaysi kimyoviy elementni bildiradi?" }
      back:
        ru: "Кислород."
        uz: "Kislorod."
    - id: trivia_009
      front: { ru: "Сколько костей в скелете взрослого человека примерно?", uz: "Kattalar odam skeletida taxminan nechta suyak bor?" }
      back:
        ru: "Около 206."
        uz: "Taxminan 206 ta."
    - id: trivia_010
      front: { ru: "Какое животное самое крупное на Земле?", uz: "Yerdagi eng katta hayvon qaysi?" }
      back:
        ru: "Синий кит."
        uz: "Ko'k kit."
    - id: trivia_011
      front: { ru: "Самая большая по площади страна в мире?", uz: "Hududi bo'yicha dunyodagi eng katta davlat?" }
      back:
        ru: "Россия."
        uz: "Rossiya."
    - id: trivia_012
      front: { ru: "Самая маленькая по площади страна в мире?", uz: "Hududi bo'yicha dunyodagi eng kichik davlat?" }
      back:
        ru: "Ватикан."
        uz: "Vatikan."
    - id: trivia_013
      front: { ru: "Какая самая глубокая точка в океане?", uz: "Okeandagi eng chuqur nuqta qaysi?" }
      back:
        ru: "Марианская впадина в Тихом океане."
        uz: "Tinch okeanidagi Mariana cho'kmasi."
    - id: trivia_014
      front: { ru: "Кто написал пьесу «Гамлет»?", uz: "«Gamlet» pyesasini kim yozgan?" }
      back:
        ru: "Уильям Шекспир."
        uz: "Uilyam Shekspir."
    - id: trivia_015
      front: { ru: "В каком году началась Вторая мировая война?", uz: "Ikkinchi jahon urushi qaysi yilda boshlangan?" }
      back:
        ru: "В 1939 году."
        uz: "1939-yilda."
    - id: trivia_016
      front: { ru: "В каком году человек впервые полетел в космос?", uz: "Inson birinchi marta qaysi yilda kosmosga uchgan?" }
      back:
        ru: "В 1961 году (Юрий Гагарин)."
        uz: "1961-yilda (Yuriy Gagarin)."
    - id: trivia_017
      front: { ru: "Кто первым из людей высадился на Луну?", uz: "Oyga birinchi bo'lib tushgan odam kim?" }
      back:
        ru: "Нил Армстронг, в 1969 году."
        uz: "Neil Armstrong, 1969-yilda."
    - id: trivia_018
      front: { ru: "Какая самая большая жаркая пустыня в мире?", uz: "Dunyodagi eng katta issiq cho'l qaysi?" }
      back:
        ru: "Сахара, в Африке."
        uz: "Sahroi Kabir (Sahara), Afrikada."
    - id: trivia_019
      front: { ru: "Столица Узбекистана?", uz: "O'zbekistonning poytaxti?" }
      back:
        ru: "Ташкент."
        uz: "Toshkent."
    - id: trivia_020
      front: { ru: "Какой древний город Узбекистана знаменит архитектурным комплексом Регистан?", uz: "O'zbekistonning qaysi qadimiy shahri Registon majmuasi bilan mashhur?" }
      back:
        ru: "Самарканд."
        uz: "Samarqand."
    - id: trivia_021
      front: { ru: "Чем исторически славится Узбекистан на Великом шёлковом пути?", uz: "O'zbekiston Buyuk ipak yo'lida tarixan nimasi bilan mashhur?" }
      back:
        ru: "Узбекистан — крупный исторический центр торговли и караванных путей (Самарканд, Бухара) на Великом шёлковом пути."
        uz: "O'zbekiston — Buyuk ipak yo'lidagi savdo va karvon yo'llarining yirik tarixiy markazi (Samarqand, Buxoro)."
    - id: trivia_022
      front: { ru: "Один из крупнейших сельскохозяйственных экспортных продуктов Узбекистана?", uz: "O'zbekistonning asosiy qishloq xo'jaligi eksport mahsulotlaridan biri?" }
      back:
        ru: "Хлопок (также фрукты и овощи)."
        uz: "Paxta (shuningdek meva va sabzavotlar)."
    - id: trivia_023
      front: { ru: "Какое крупное озеро/море сильно уменьшилось в Центральной Азии за последние десятилетия?", uz: "Markaziy Osiyoda so'nggi o'n yilliklarda qaysi yirik ko'l/dengiz juda kichraydi?" }
      back:
        ru: "Аральское море."
        uz: "Orol dengizi."
    - id: trivia_024
      front: { ru: "Какая географическая особенность делает Узбекистан редким случаем в мире?", uz: "Qaysi geografik xususiyat O'zbekistonni dunyoda noyob holatga aylantiradi?" }
      back:
        ru: "Узбекистан — одна из немногих стран мира, не имеющих выхода даже к морю, которое само имеет выход к океану («дважды континентальная» страна)."
        uz: "O'zbekiston — okeanga chiqishi bo'lgan dengizga ham chiqish imkoni bo'lmagan juda kam sonli davlatlardan biri («ikki marta quruqlikdagi» davlat)."
    - id: trivia_025
