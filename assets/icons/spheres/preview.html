<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>NewLife — иконки сфер (превью)</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    padding: 40px;
    background: #0d1117;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #e6edf3;
  }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 24px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 20px;
  }
  .card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 20px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .card svg {
    width: 56px;
    height: 56px;
    filter: drop-shadow(0 0 6px currentColor);
  }
  .card span.label {
    font-size: 12px;
    letter-spacing: .02em;
    color: #9da7b1;
  }
  /* каждой сфере — свой цвет свечения, подключается только через CSS/класс,
     сам SVG не меняется (currentColor) */
  .c-body          { color: #ff6b6b; }
  .c-mind          { color: #7c6bff; }
  .c-character     { color: #ffb14e; }
  .c-social        { color: #4ecdc4; }
  .c-career        { color: #5eb3ff; }
  .c-finance       { color: #ffd93d; }
  .c-relationships { color: #ff8fb1; }
  .c-knowledge     { color: #6bd98a; }
  .c-values        { color: #c792ea; }
  .c-lifestyle     { color: #4fd1c5; }
  .c-energy        { color: #ffe066; }
</style>
</head>
<body>
  <h1>NewLife — 11 иконок сфер (viewBox 0 0 24 24, currentColor, свечение через CSS filter: drop-shadow)</h1>
  <div class="grid">

    <div class="card c-body">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10.25"/>
        <path d="M6 9v6M8 7v10M16 7v10M18 9v6M8 12h8"/>
      </svg>
      <span class="label">body</span>
    </div>

    <div class="card c-mind">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9.5 7.2A2.6 2.6 0 0 0 7 9.7a2.6 2.6 0 0 0 .9 1.95A2.7 2.7 0 0 0 7.4 15a2.7 2.7 0 0 0 2.7 2.7h0a1.8 1.8 0 0 0 1.8-1.8V8.9a1.8 1.8 0 0 0-1.8-1.8 2.6 2.6 0 0 0-.6.1Z"/>
        <path d="M14.5 7.2a2.6 2.6 0 0 1 2.5 2.5 2.6 2.6 0 0 1-.9 1.95A2.7 2.7 0 0 1 16.6 15a2.7 2.7 0 0 1-2.7 2.7h0a1.8 1.8 0 0 1-1.8-1.8V8.9a1.8 1.8 0 0 1 1.8-1.8 2.6 2.6 0 0 1 .6.1Z"/>
        <circle cx="12" cy="12" r="10.25"/>
      </svg>
      <span class="label">mind</span>
    </div>

    <div class="card c-character">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10.25"/>
        <path d="M12 5.3 7 7.5v4.3c0 3.6 2.1 5.9 5 7.2 2.9-1.3 5-3.6 5-7.2V7.5L12 5.3Z"/>
        <path d="M9.6 12.3 11.4 14.1 14.6 10.3"/>
      </svg>
      <span class="label">character</span>
    </div>

    <div class="card c-social">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10.25"/>
        <path d="M6.5 8h7A2 2 0 0 1 15.5 10v2.5a2 2 0 0 1-2 2H10l-2.6 2v-2H6.5a2 2 0 0 1-2-2V10A2 2 0 0 1 6.5 8Z"/>
        <path d="M14.2 6.2h2.3A2 2 0 0 1 18.5 8.2v2.5a2 2 0 0 1-1.1 1.78"/>
      </svg>
      <span class="label">social</span>
    </div>

    <div class="card c-career">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10.25"/>
        <rect x="5.5" y="9.3" width="13" height="8.2" rx="1.4"/>
        <path d="M9.2 9.3V7.6a1.8 1.8 0 0 1 1.8-1.8h2a1.8 1.8 0 0 1 1.8 1.8v1.7"/>
        <path d="M5.5 13.2h13"/>
      </svg>
      <span class="label">career</span>
    </div>

    <div class="card c-finance">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10.25"/>
        <path d="M5.3 8.8a2 2 0 0 1 2-2h9.4a2 2 0 0 1 2 2v1h.8a1 1 0 0 1 1 1v3.5a1 1 0 0 1-1 1h-.8v1a2 2 0 0 1-2 2H7.3a2 2 0 0 1-2-2V8.8Z"/>
        <circle cx="15.6" cy="13.1" r="1.15"/>
      </svg>
      <span class="label">finance</span>
    </div>

    <div class="card c-relationships">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10.25"/>
        <path d="M9.6 9.2c-1-1.15-2.75-1.15-3.75.05-1 1.2-.9 2.95.3 4.05L9.6 16.5l3.45-3.2c1.2-1.1 1.3-2.85.3-4.05-1-1.2-2.75-1.2-3.75-.05Z"/>
        <path d="M15.5 10.9c-.75-.9-2.05-.9-2.8 0-.75.9-.65 2.2.3 3.05l2.5 2.25 2.5-2.25c.95-.85 1.05-2.15.3-3.05-.75-.9-2.05-.9-2.8 0Z"/>
      </svg>
      <span class="label">relationships</span>
    </div>

    <div class="card c-knowledge">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10.25"/>
        <path d="M12 8.3c-1.6-1.1-4-1.6-6-1.1v10.3c2-.5 4.4 0 6 1.1 1.6-1.1 4-1.6 6-1.1V7.2c-2-.5-4.4 0-6 1.1Z"/>
        <path d="M12 8.3v10.3"/>
      </svg>
      <span class="label">knowledge</span>
    </div>

    <div class="card c-values">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10.25"/>
        <path d="M12 6 13.7 9.65 17.7 10.15 14.85 12.95 15.6 16.95 12 15 8.4 16.95 9.15 12.95 6.3 10.15 10.3 9.65Z"/>
      </svg>
      <span class="label">values</span>
    </div>

    <div class="card c-lifestyle">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10.25"/>
        <path d="M6.2 12.3 12 7.2l5.8 5.1"/>
        <path d="M7.6 11.1v6.2h8.8v-6.2"/>
        <path d="M10.2 17.3v-3.1h3.6v3.1"/>
      </svg>
      <span class="label">lifestyle</span>
    </div>

    <div class="card c-energy">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10.25"/>
        <path d="M13 4.8 7.6 13.1h3.9l-.9 6.1 5.8-8.4h-3.9Z"/>
      </svg>
      <span class="label">energy</span>
    </div>

  </div>
</body>
</html>
