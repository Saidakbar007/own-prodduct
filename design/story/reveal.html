<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8" />
<title>Сезоны — карточка Reveal</title>
<link rel="stylesheet" href="/design/tokens.css" />
<link rel="stylesheet" href="/design/base.css" />
<link rel="stylesheet" href="/design/story/story.css" />
</head>
<body>
<svg class="sr-only" aria-hidden="true">
  <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z" stroke-width="1.75" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.4" stroke-width="1.75"/></symbol>
  <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M7 4h10v4a5 5 0 0 1-10 0z" stroke-width="1.75" stroke-linejoin="round"/><path d="M12 13v3m-3 3h6" stroke-width="1.75" stroke-linecap="round"/><path d="M7 5H4v2a3 3 0 0 0 3 3M17 5h3v2a3 3 0 0 1-3 3" stroke-width="1.75"/></symbol>
</svg>

<div class="story-card">
  <div class="story-card__glow" style="background:
      radial-gradient(80% 40% at 50% 0%, rgba(255,182,72,.34), transparent 60%),
      radial-gradient(60% 34% at 15% 90%, rgba(31,190,140,.2), transparent 60%),
      linear-gradient(200deg, #241c12, var(--bg) 55%)"></div>
  <div class="story-card__brand">
    <span class="story-card__wordmark">Сезоны</span>
    <span class="story-card__tag"><svg class="icon" style="width:28px;height:28px"><use href="#i-trophy"/></svg>Reveal</span>
  </div>

  <div class="reveal-card__badge story-card__tag" style="background:var(--status-done-soft);color:var(--status-done)">Сезон пройден</div>
  <h1 class="reveal-card__title">Бег: с нуля до 5 км</h1>
  <p class="reveal-card__sub">30 дней позади · ты сделал это</p>

  <div class="reveal-card__compare">
    <div>
      <div class="reveal-card__value tabular">0 км</div>
      <div class="reveal-card__tag">день 0</div>
    </div>
    <div>
      <div class="reveal-card__value reveal-card__value--after tabular">5.2 км</div>
      <div class="reveal-card__tag">день 30</div>
    </div>
  </div>

  <div class="reveal-card__proofs">
    <div class="reveal-card__shot"><svg class="icon"><use href="#i-camera"/></svg></div>
    <div class="reveal-card__shot"><svg class="icon"><use href="#i-camera"/></svg></div>
  </div>

  <div class="story-card__footer">
    <div class="story-card__qr" aria-hidden="true"></div>
    <div class="story-card__cta">
      <span class="story-card__cta-label">sezony.app · следующий сезон</span>
      <span class="story-card__cta-value">10 км</span>
    </div>
  </div>
</div>
</body>
</html>
