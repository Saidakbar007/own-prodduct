<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8" />
<title>Сезоны — карточка серии</title>
<link rel="stylesheet" href="/design/tokens.css" />
<link rel="stylesheet" href="/design/base.css" />
<link rel="stylesheet" href="/design/story/story.css" />
</head>
<body>
<svg class="sr-only" aria-hidden="true">
  <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z" stroke-width="1.75" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.4" stroke-width="1.75"/></symbol>
</svg>

<div class="story-card">
  <div class="story-card__glow" style="background:
      radial-gradient(70% 36% at 80% 0%, rgba(255,182,72,.32), transparent 60%),
      radial-gradient(60% 30% at 0% 100%, rgba(31,190,140,.16), transparent 60%),
      linear-gradient(200deg, #241c12, var(--bg) 55%)"></div>
  <img class="story-card__art" src="/assets/art/hero/hero_3.webp" alt="" style="right:-60px;bottom:420px;width:520px" />

  <div class="story-card__brand">
    <span class="story-card__wordmark">Сезоны</span>
    <span class="story-card__tag">Серия 3</span>
  </div>

  <span class="story-card__eyebrow">Бег: с нуля до 5 км</span>
  <h1 class="story-card__title">Первые 10 минут без остановки</h1>
  <p class="story-card__meta">12–18 ноября · неделя 3 из 5</p>

  <div class="story-card__stats">
    <div>
      <div class="story-card__stat-value tabular">5 / 7</div>
      <div class="story-card__stat-label">дней сделано</div>
    </div>
    <div>
      <div class="story-card__stat-value tabular">4.1 км</div>
      <div class="story-card__stat-label">лучший забег</div>
    </div>
  </div>

  <p class="story-card__quote">«Сегодня я не остановился на середине — и это было легче, чем вчера.»</p>

  <div class="story-card__footer">
    <div class="story-card__qr" aria-hidden="true"></div>
    <div class="story-card__cta">
      <span class="story-card__cta-label">sezony.app</span>
      <span class="story-card__cta-value">Старт в ПН</span>
    </div>
  </div>
</div>
</body>
</html>
